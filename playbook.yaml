---

- name: Linux Hardening Audit Raw Mode - MinIO Upload
  hosts: all
  become: true
  gather_facts: false

  vars:

    #############################################
    # Script Hardening
    #############################################

    script_name: linux_hardening_audit2.sh

    remote_script_dir: /opt/linux_hardening_audit2_temp

    remote_script: "{{ remote_script_dir }}/{{ script_name }}"


    report_name: "hardening-{{ inventory_hostname }}-{{ lookup('pipe','date +%F_%H-%M-%S') }}.txt"

    report_path: "{{ remote_script_dir }}/{{ report_name }}"


    #############################################
    # Storage Host
    #############################################

    storage_host: lst-svr-henry

    local_report_dir: /opt/linux_hardening_audit2_temp

    local_report_path: "{{ local_report_dir }}/{{ report_name }}"


    #############################################
    # MinIO
    #############################################

    minio_bucket: hardening-linux

    minio_alias: minio-server-hardening-linux

    mc_binary_path: /usr/local/bin/mc



  tasks:


    #############################################
    # INFORMATION
    #############################################

    - name: Identifier
      raw: |
        echo "Linux Hardening Audit RAW Mode Started"
      changed_when: false


    - name: Get hostname
      raw: hostname
      register: raw_hostname
      changed_when: false


    - name: Get IP
      raw: |
        hostname -I | awk '{print $1}'
      register: raw_ip
      changed_when: false


    - name: Get OS
      raw: |
        cat /etc/os-release | grep -E '^(NAME|VERSION)=' | tr -d '"'
      register: raw_os
      changed_when: false


    - name: Display information
      debug:
        msg:
          - "=============================="
          - "Inventory : {{ inventory_hostname }}"
          - "Hostname  : {{ raw_hostname.stdout | trim }}"
          - "IP        : {{ raw_ip.stdout | trim }}"
          - "OS        : {{ raw_os.stdout_lines }}"
          - "=============================="



    #############################################
    # CREATE DIRECTORY
    #############################################

    - name: Create working directory
      raw: |
        mkdir -p {{ remote_script_dir }}
      changed_when: false



    #############################################
    # COPY SCRIPT
    #############################################

    - name: Check script
      raw: |
        test -f {{ remote_script }} && echo EXISTS || echo MISSING
      register: script_check
      changed_when: false



    - name: Transfer script
      raw: |
        echo '{{ lookup("file","files/" + script_name) | b64encode }}' | base64 -d > {{ remote_script }}
        chmod 0755 {{ remote_script }}
      when:
        - "'MISSING' in script_check.stdout"



    - name: Verify script
      raw: |
        test -f {{ remote_script }} && echo EXISTS || echo FAILED
      register: script_verify
      changed_when: false



    - name: Fail script missing
      fail:
        msg: "Script tidak ditemukan"
      when:
        - "'FAILED' in script_verify.stdout"



    #############################################
    # EXECUTE SCRIPT
    #############################################

    - name: Execute hardening script
      raw: |
        cd {{ remote_script_dir }}
        {{ remote_script }}
      register: hardening_result
      changed_when: true



    - name: Show output
      debug:
        var: hardening_result.stdout_lines



    #############################################
    # FIND GENERATED REPORT
    #############################################

    - name: Detect generated txt report
      raw: |
        find /opt -type f -name "*.txt" -mmin -10 | tail -1 | tr -d '\r\n'
      register: detected_report
      changed_when: false



    - name: Show detected report
      debug:
        msg:
          - "Detected:"
          - "{{ detected_report.stdout | trim }}"



    - name: Validate report
      fail:
        msg: "Report tidak ditemukan"
      when:
        - detected_report.stdout | trim == ""



    #############################################
    # MOVE REPORT
    #############################################

    - name: Move report into working directory
      raw: |
        mv "{{ detected_report.stdout | trim }}" "{{ report_path }}"



    - name: Verify moved report
      raw: |
        test -f {{ report_path }} && echo EXISTS || echo FAILED
      register: report_verify
      changed_when: false



    - name: Fail move report
      fail:
        msg: "Report gagal dipindahkan"
      when:
        - "'FAILED' in report_verify.stdout"



    #############################################
    # READ REPORT
    #############################################

    - name: Read report
      raw: |
        cat {{ report_path }}
      register: report_content
      changed_when: false



    - name: Display report
      debug:
        var: report_content.stdout_lines
    #############################################
    # PREPARE STORAGE HOST
    #############################################

    - name: Create storage directory
      delegate_to: "{{ storage_host }}"
      raw: |
        mkdir -p {{ local_report_dir }}
      changed_when: false



    #############################################
    # COPY REPORT VIA AWX
    #############################################

    - name: Copy report to lst-svr-henry
      delegate_to: "{{ storage_host }}"
      copy:
        content: "{{ report_content.stdout }}"
        dest: "{{ local_report_path }}"
        mode: "0644"



    - name: Verify storage report
      delegate_to: "{{ storage_host }}"
      raw: |
        test -f {{ local_report_path }} && echo EXISTS || echo FAILED
      register: storage_verify
      changed_when: false



    - name: Fail storage copy
      fail:
        msg: "Gagal menyimpan report di {{ storage_host }}"
      when:
        - "'FAILED' in storage_verify.stdout"



    #############################################
    # MINIO UPLOAD
    #############################################

    - name: Check mc
      delegate_to: "{{ storage_host }}"
      raw: |
        test -x {{ mc_binary_path }} && echo EXISTS || echo FAILED
      register: mc_check
      changed_when: false



    - name: Fail if mc missing
      fail:
        msg: "mc tidak ditemukan di {{ storage_host }}"
      when:
        - "'FAILED' in mc_check.stdout"



    - name: Upload report to MinIO
      delegate_to: "{{ storage_host }}"
      raw: |
        {{ mc_binary_path }} cp \
        {{ local_report_path }} \
        {{ minio_alias }}/{{ minio_bucket }}/{{ report_name }}
      register: minio_upload
      changed_when: true



    - name: Show MinIO result
      debug:
        var: minio_upload.stdout_lines



    #############################################
    # VERIFY MINIO
    #############################################

    - name: Verify MinIO object
      delegate_to: "{{ storage_host }}"
      raw: |
        {{ mc_binary_path }} stat \
        {{ minio_alias }}/{{ minio_bucket }}/{{ report_name }}
      register: minio_verify
      changed_when: false



    - name: Fail MinIO verification
      fail:
        msg: "Object {{ report_name }} tidak ditemukan di MinIO"
      when:
        - minio_verify.rc != 0



    #############################################
    # CLEANUP TARGET
    # Jangan hapus report
    #############################################

    - name: Remove script only
      raw: |
        rm -f {{ remote_script }}
      changed_when: true



    #############################################
    # SUMMARY
    #############################################

    - name: Job Summary
      debug:
        msg:
          - "================================="
          - "STATUS       : SUCCESS"
          - "HOST         : {{ inventory_hostname }}"
          - "REPORT       : {{ report_name }}"
          - "STORAGE HOST : {{ storage_host }}"
          - "MINIO BUCKET : {{ minio_bucket }}"
          - "UPLOAD       : SUCCESS"
          - "================================="