---

- name: Linux Hardening Audit RAW Mode - MinIO Upload
  hosts: all
  become: true
  gather_facts: false

  vars:

    #############################################
    # SCRIPT HARDENING
    #############################################

    script_name: linux_hardening_audit2.sh

    remote_script_dir: /opt/linux_hardening_audit2_temp

    remote_script: "{{ remote_script_dir }}/{{ script_name }}"


    #############################################
    # LOCAL STORAGE (VM ANSIBLE)
    #############################################

    local_report_dir: "/opt/linux_hardening_audit2_temp"

    local_report_path: "{{ local_report_dir }}/{{ report_name | default('unknown.txt') }}"


    #############################################
    # MINIO
    #############################################

    minio_bucket: "hardening-linux"

    minio_alias: "minio-server-hardening-linux"

    mc_binary_path: "/usr/local/bin/mc"



  tasks:

    #############################################
    # IDENTIFICATION
    #############################################

    - name: Identifier
      raw: |
        echo "Linux Hardening Audit RAW Mode Started"
      changed_when: false


    - name: Get hostname
      raw: |
        hostname
      register: raw_hostname
      changed_when: false


    - name: Get IP Address
      raw: |
        hostname -I | awk '{print $1}'
      register: raw_ip
      changed_when: false


    - name: Get OS Information
      raw: |
        cat /etc/os-release | grep -E '^(NAME|VERSION)' | tr -d '"'
      register: raw_os
      changed_when: false


    - name: Display Host Information
      debug:
        msg:
          - "================================="
          - "Inventory : {{ inventory_hostname }}"
          - "Hostname  : {{ raw_hostname.stdout | trim }}"
          - "IP        : {{ raw_ip.stdout | trim }}"
          - "OS        : {{ raw_os.stdout_lines }}"
          - "================================="



    #############################################
    # CREATE WORK DIR
    #############################################

    - name: Create working directory
      raw: |
        mkdir -p {{ remote_script_dir }}
      changed_when: false



    #############################################
    # COPY SCRIPT RAW MODE
    #############################################

    - name: Check script existing
      raw: |
        test -f {{ remote_script }} && echo EXISTS || echo MISSING
      register: script_check
      changed_when: false



    - name: Copy hardening script
      raw: |
        echo '{{ lookup("file", "files/" + script_name) | b64encode }}' \
        | base64 -d > {{ remote_script }}

        chmod 0755 {{ remote_script }}

      when:
        - "'MISSING' in script_check.stdout"



    - name: Verify script
      raw: |
        test -f {{ remote_script }} && echo EXISTS || echo FAILED
      register: script_verify
      changed_when: false



    - name: Fail if script missing
      fail:
        msg: "Script tidak ditemukan {{ remote_script }}"
      when:
        - "'FAILED' in script_verify.stdout"



    #############################################
    # EXECUTE SCRIPT
    # IMPORTANT:
    # SCRIPT TIDAK DIBERI PARAMETER
    #############################################

    - name: Execute hardening script
      raw: |
        cd {{ remote_script_dir }}

        {{ remote_script }}

      register: hardening_result

      changed_when: true



    - name: Show script stdout
      debug:
        var: hardening_result.stdout_lines



    #############################################
    # DETECT REPORT RESULT
    #############################################

    - name: Detect generated txt report
      raw: |
        find {{ remote_script_dir }} \
        -maxdepth 1 \
        -type f \
        -name "*.txt" \
        -printf "%T@ %p\n" \
        | sort -nr \
        | head -1 \
        | cut -d' ' -f2

      register: detected_report

      changed_when: false



    - name: Validate report detected
      fail:
        msg: |
          Report TXT tidak ditemukan.

          Directory:
          {{ remote_script_dir }}

          Output:
          {{ detected_report.stdout }}

      when:
        - detected_report.stdout | trim == ""



    - name: Set report variable
      set_fact:

        report_path: "{{ detected_report.stdout | trim }}"

        report_name: "{{ detected_report.stdout | trim | basename }}"



    - name: Show detected report
      debug:
        msg:
          - "Report ditemukan:"
          - "{{ report_path }}"
    #############################################
    # DISPLAY REPORT CONTENT
    #############################################

    - name: Read hardening report
      raw: |
        cat "{{ report_path }}"
      register: report_content
      changed_when: false


    - name: Display hardening report
      debug:
        var: report_content.stdout_lines



    #############################################
    # PREPARE LOCAL STORAGE ON ANSIBLE VM
    #############################################

    - name: Create local report directory
      delegate_to: localhost
      file:
        path: "{{ local_report_dir }}"
        state: directory
        mode: "0755"



    #############################################
    # COPY REPORT TO ANSIBLE VM
    #############################################

    - name: Save report to Ansible VM
      delegate_to: localhost
      copy:
        content: "{{ report_content.stdout }}"
        dest: "{{ local_report_dir }}/{{ report_name }}"
        mode: "0644"



    - name: Verify local report exists
      delegate_to: localhost
      stat:
        path: "{{ local_report_dir }}/{{ report_name }}"
      register: local_report_check



    - name: Fail if local report missing
      fail:
        msg: |
          Report gagal disimpan di VM Ansible:

          {{ local_report_dir }}/{{ report_name }}

      when:
        - not local_report_check.stat.exists



    #############################################
    # UPLOAD TO MINIO
    #############################################

    - name: Upload report to MinIO
      delegate_to: localhost
      command: >
        {{ mc_binary_path }}
        cp
        {{ local_report_dir }}/{{ report_name }}
        {{ minio_alias }}/{{ minio_bucket }}/{{ report_name }}

      register: minio_upload

      changed_when: true



    - name: Display MinIO upload result
      debug:
        var: minio_upload.stdout_lines



    #############################################
    # VERIFY MINIO OBJECT
    #############################################

    - name: Verify report in MinIO
      delegate_to: localhost
      command: >
        {{ mc_binary_path }}
        stat
        {{ minio_alias }}/{{ minio_bucket }}/{{ report_name }}

      register: minio_verify

      changed_when: false

      failed_when: minio_verify.rc != 0



    #############################################
    # SUCCESS SUMMARY
    #############################################

    - name: Job Summary
      debug:
        msg:
          - "================================="
          - "STATUS       : SUCCESS"
          - "HOST         : {{ inventory_hostname }}"
          - "HOSTNAME     : {{ raw_hostname.stdout | trim }}"
          - "REPORT       : {{ report_name }}"
          - "LOCAL PATH   : {{ local_report_dir }}/{{ report_name }}"
          - "MINIO BUCKET : {{ minio_bucket }}"
          - "UPLOAD       : SUCCESS"
          - "================================="



  #############################################
  # ERROR HANDLING
  #############################################

  rescue:

    - name: Audit failed summary
      debug:
        msg:
          - "================================="
          - "STATUS : FAILED"
          - "HOST   : {{ inventory_hostname }}"
          - "TASK   : Linux Hardening Audit"
          - "================================="



  #############################################
  # IMPORTANT
  #
  # JANGAN DELETE REPORT
  #
  # Folder target sengaja dipertahankan
  # agar hasil audit tetap tersedia.
  #############################################          