---
- name: Linux Hardening Audit (Raw Mode - Tanpa Python di Target)
  hosts: all
  become: true
  gather_facts: false

  vars:

    #############################################
    # Script Hardening
    # NOTE: jika script sudah ada di host target,
    # transfer akan di-skip otomatis (idempoten)
    #############################################

    script_name: linux_hardening_audit2.sh
    remote_script_dir: /opt/linux_hardening_audit2_temp
    remote_script: "{{ remote_script_dir }}/{{ script_name }}"

    # inventory_hostname dipakai (bukan ansible_hostname),
    # karena gather_facts dimatikan sehingga ansible_hostname
    # tidak tersedia.
    report_name: "hardening-{{ inventory_hostname }}-{{ lookup('pipe', 'date +%F_%H-%M-%S') }}.txt"
    report_path: "{{ remote_script_dir }}/{{ report_name }}"

    #############################################
    # Penyimpanan Lokal di VM Ansible
    #############################################

    local_report_dir: "/opt/linux_hardening_audit2_temp"
    local_report_path: "{{ local_report_dir }}/{{ report_name }}"

    #############################################
    # MinIO Client (mc) - Install & Alias OTOMATIS
    # NOTE PENTING: delegate_to localhost berjalan di
    # dalam Execution Environment (container) AWX yang
    # EPHEMERAL - filesystem-nya BEDA dari VM fisik tempat
    # kamu install mc secara manual sebelumnya. Container
    # ini fresh setiap job run, jadi mc HARUS di-install
    # ulang otomatis di sini setiap kali playbook jalan.
    #############################################

    minio_endpoint: "http://10.64.1.2:9000"
    minio_bucket: "hardening-linux"
    minio_alias: "minio-server-hardening-linux"

    mc_binary_path: "/usr/local/bin/mc"
    mc_download_url: "https://dl.min.io/client/mc/release/linux-amd64/mc"

    # Simpan di AWX Credential / Extra Variables (jangan hardcode plaintext)
    minio_access_key: "{{ vault_minio_access_key }}"
    minio_secret_key: "{{ vault_minio_secret_key }}"

  tasks:

#########################################################################
# HOST INFORMATION (RAW, TANPA GATHER FACTS)
#########################################################################

    - name: IDENTIFIER - Linux Hardening Audit (raw mode)
      raw: 'echo "Playbook loaded - Linux Hardening Audit (raw mode)"'
      changed_when: false

    - name: Get hostname (raw)
      raw: hostname
      register: raw_hostname
      changed_when: false

    - name: Get IP address (raw)
      raw: "hostname -I | awk '{print $1}'"
      register: raw_ip
      changed_when: false

    - name: Get OS info (raw)
      raw: "cat /etc/os-release | grep -E '^(NAME|VERSION)=' | tr -d '\"'"
      register: raw_os
      changed_when: false

    - name: Display target information
      debug:
        msg:
          - "========================================"
          - "Inventory : {{ inventory_hostname }}"
          - "Hostname  : {{ raw_hostname.stdout | trim }}"
          - "IP        : {{ raw_ip.stdout | trim }}"
          - "OS        : {{ raw_os.stdout_lines | default([]) }}"
          - "========================================"

#########################################################################
# CREATE WORKING DIRECTORY
#########################################################################

    - name: Create working directory
      raw: "mkdir -p {{ remote_script_dir }}"
      changed_when: false

#########################################################################
# ENSURE SCRIPT EXISTS ON TARGET (RAW, TRANSFER HANYA JIKA BELUM ADA)
#########################################################################

    - name: Check if hardening script already exists on target (raw)
      raw: "test -f {{ remote_script }} && echo EXISTS || echo MISSING"
      register: script_check_before
      changed_when: false

    # Transfer file dilakukan dengan encode isi script lokal (di control
    # node) jadi base64, lalu di-decode kembali langsung di sisi target
    # lewat raw command. Ini menggantikan modul "copy" yang butuh Python.
    - name: Transfer hardening script to target (raw, base64)
      raw: >
        echo '{{ lookup('file', 'files/' + script_name) | b64encode }}'
        | base64 -d > {{ remote_script }} && chmod 0755 {{ remote_script }}
      when: "'MISSING' in script_check_before.stdout"
      changed_when: true

    - name: Verify hardening script exists after transfer (raw)
      raw: "test -f {{ remote_script }} && echo EXISTS || echo MISSING"
      register: script_check_after
      changed_when: false

    - name: Stop if hardening script still not found
      fail:
        msg: >
          Script hardening tidak ditemukan/berhasil ditransfer ke
          {{ remote_script }} pada host {{ inventory_hostname }}.
      when: "'MISSING' in script_check_after.stdout"

    - name: Ensure script is executable (raw)
      raw: "chmod 0755 {{ remote_script }}"
      changed_when: false

#########################################################################
# EXECUTE SCRIPT (RAW)
#########################################################################

    - name: Execute hardening script (raw)
      raw: "{{ remote_script }} {{ report_path }}"
      register: hardening
      changed_when: true
      ignore_errors: true
      ignore_unreachable: true

    - name: Show script output
      debug:
        var: hardening.stdout_lines
      when: hardening.stdout_lines is defined

    - name: Show script error
      debug:
        var: hardening.stderr_lines
      when:
        - hardening.stderr is defined
        - hardening.stderr | default('') | length > 0

#########################################################################
# READ REPORT (REMOTE, RAW, ANTI-DISCONNECT & WILDCARD)
#########################################################################

    - name: Read report content from target (raw with retry)
      raw: "cat /opt/linux_hardening_audit2_temp/hardening-{{ inventory_hostname }}-*.txt"
      register: report_raw_content
      # Cukup pastikan return code adalah 0 (file ketemu dan berhasil di-cat)
      until: report_raw_content.rc is defined and report_raw_content.rc == 0
      retries: 15
      delay: 10
      # Buat Ansible mengabaikan gangguan penutupan koneksi SSH di akhir transmisi teks
      ignore_errors: true
      changed_when: false

    - name: Stop if report missing or unreadable
      fail:
        msg: "Hardening report was not generated."
      # Validasi ulang secara aman menggunakan rc (return code)
      when: report_raw_content.rc is not defined or report_raw_content.rc != 0

#########################################################################
# DISPLAY REPORT (RAW)
#########################################################################

    - name: Display report (raw)
      debug:
        var: report_raw_content.stdout_lines

#########################################################################
# PREPARE LOCAL STORAGE (DI EXECUTION ENVIRONMENT / VM ANSIBLE)
#########################################################################

    - name: Ensure local temp directory exists on Ansible VM
      delegate_to: localhost
      become: true       # Memaksa pembuatan folder menggunakan akses root VM Ansible
      ansible.builtin.file:
        path: "/opt/linux_hardening_audit2_temp"
        state: directory
        mode: "0777"     # Izin luas agar file dari semua user/node bisa ditulis

#########################################################################
# SAVE REPORT TO LOCAL ANSIBLE VM DIRECTORY
#########################################################################

    - name: Save report to local Ansible VM directory
      delegate_to: localhost
      become: true       # Menggunakan akses root untuk menulis file ke direktori sistem
      ansible.builtin.copy:
        content: "{{ report_raw_content.stdout }}"
        # Disimpan langsung ke folder /opt/linux_hardening_audit2_temp/ di VM Ansible
        dest: "/opt/linux_hardening_audit2_temp/hardening-{{ inventory_hostname }}-report.txt"

#########################################################################
# INSTALL & CONFIGURE MC CLIENT DI EXECUTION ENVIRONMENT (LOCALHOST)
#########################################################################

    # Ini WAJIB dijalankan setiap job run karena Execution Environment
    # AWX bersifat ephemeral (container fresh tiap kali job jalan).
    # Instalasi mc manual via SSH ke VM fisik TIDAK persist di sini.

    - name: Check if mc binary already exists in Execution Environment
      delegate_to: localhost
      become: true
      ansible.builtin.stat:
        path: "{{ mc_binary_path }}"
      register: mc_installed

    - name: Download mc (MinIO Client) binary
      delegate_to: localhost
      become: true
      ansible.builtin.get_url:
        url: "{{ mc_download_url }}"
        dest: "{{ mc_binary_path }}"
        mode: "0755"
      when: not mc_installed.stat.exists

    - name: Verify mc client version
      delegate_to: localhost
      become: true
      ansible.builtin.command: "{{ mc_binary_path }} --version"
      register: mc_version
      changed_when: false

    - name: Show mc client version
      debug:
        var: mc_version.stdout_lines

    - name: Set mc alias for MinIO endpoint
      delegate_to: localhost
      become: true
      ansible.builtin.command: >
        {{ mc_binary_path }} alias set {{ minio_alias }}
        {{ minio_endpoint }} {{ minio_access_key }} {{ minio_secret_key }}
      changed_when: true
      no_log: true

#########################################################################
# VALIDATE DUPLICATE BEFORE UPLOAD (LOCAL VIA ROOT VM ANSIBLE)
#########################################################################

    - name: Compute local report checksum (md5)
      delegate_to: localhost
      become: true       # Menggunakan root untuk membaca berkas lokal di /opt/
      ansible.builtin.stat:
        path: "/opt/linux_hardening_audit2_temp/hardening-{{ inventory_hostname }}-report.txt"
        checksum_algorithm: md5
      register: local_report_stat

    - name: Check if report already exists in MinIO bucket
      delegate_to: localhost
      become: true       # Menggunakan root agar perintah mc terdeteksi sistem
      ansible.builtin.shell: "{{ mc_binary_path }} stat {{ minio_alias }}/{{ minio_bucket }}/{{ report_name }}"
      register: mc_remote_stat
      changed_when: false
      failed_when: false

    - name: Extract remote ETag (jika object sudah ada)
      delegate_to: localhost
      set_fact:
        remote_etag: "{{ (mc_remote_stat.stdout | regex_search('ETag\\s*:\\s*([a-f0-9]+)', '\\1') | first) | default('') }}"
      when: mc_remote_stat.rc == 0

    - name: Determine duplicate status
      delegate_to: localhost
      set_fact:
        is_duplicate: "{{ (mc_remote_stat.rc == 0) and (remote_etag | default('') == local_report_stat.stat.checksum) }}"

    - name: Show duplicate skip message
      debug:
        msg: "File {{ report_name }} sudah ada di bucket dengan checksum identik, upload dilewati (SKIP)."
      when: is_duplicate

#########################################################################
# UPLOAD REPORT TO MINIO USING MC (EKSEKUSI VIA PATH ABSOLUT ROOT)
#########################################################################

    - name: Upload report to MinIO using mc via root
      delegate_to: localhost
      become: true
      ansible.builtin.shell: |
        {{ mc_binary_path }} cp "/opt/linux_hardening_audit2_temp/hardening-{{ inventory_hostname }}-report.txt" "{{ minio_alias }}/{{ minio_bucket }}/{{ report_name }}"
      register: upload_result
      changed_when: true
      when: not is_duplicate

    - name: Show upload result
      debug:
        var: upload_result.stdout_lines
      when: not is_duplicate

#########################################################################
# VERIFY UPLOAD (MC VIA PATH ABSOLUT ROOT)
#########################################################################

    - name: Verify object exists in MinIO bucket
      delegate_to: localhost
      become: true
      ansible.builtin.shell: "{{ mc_binary_path }} stat {{ minio_alias }}/{{ minio_bucket }}/{{ report_name }}"
      register: mc_stat_result
      changed_when: false
      failed_when: mc_stat_result.rc != 0

    - name: Upload validation
      fail:
        msg: "Upload report ke MinIO gagal untuk {{ report_name }}."
      when: mc_stat_result.rc != 0

#########################################################################
# CLEANUP REMOTE (RAW)
#########################################################################

    - name: Remove working directory from target (raw)
      raw: "rm -rf {{ remote_script_dir }}"
      changed_when: true

#########################################################################
# NOTE: LOCAL REPORT FILE
#########################################################################

    # File laporan lokal sengaja TIDAK dihapus, karena sesuai permintaan
    # laporan harus tetap tersimpan di {{ local_report_dir }} pada VM Ansible.

#########################################################################
# SUCCESS
#########################################################################

    - name: Job Summary
      debug:
        msg:
          - "========================================"
          - "HOSTNAME     : {{ raw_hostname.stdout | trim }}"
          - "STATUS       : SUCCESS"
          - "LOCAL REPORT : {{ local_report_path }}"
          - "BUCKET       : {{ minio_bucket }}"
          - "MINIO ALIAS  : {{ minio_alias }}"
          - "UPLOAD       : {{ 'SKIPPED (DUPLICATE)' if is_duplicate else 'SUCCESS' }}"
          - "========================================"