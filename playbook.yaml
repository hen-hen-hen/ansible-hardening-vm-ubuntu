---

- name: Linux Hardening Audit Raw Mode - MinIO Upload
  hosts: all
  become: true
  gather_facts: false

  vars:

    #############################################
    # Script Hardening
    #############################################

    script_name: linux_hardening_audit2.sh

    remote_script_dir: /opt/linux_hardening_audit2_temp

    remote_script: "{{ remote_script_dir }}/{{ script_name }}"

    report_name: "hardening-{{ inventory_hostname }}-{{ lookup('pipe','date +%F_%H-%M-%S') }}.txt"

    report_path: "{{ remote_script_dir }}/{{ report_name }}"


    #############################################
    # Storage Host (lst-svr-henry)
    #############################################

    storage_host: "lst-svr-henry"

    local_report_dir: "/opt/linux_hardening_audit2_temp"

    local_report_path: "{{ local_report_dir }}/{{ report_name }}"


    #############################################
    # MinIO
    #############################################

    minio_bucket: "hardening-linux"

    minio_alias: "minio-server-hardening-linux"

    mc_binary_path: "/usr/local/bin/mc"



  tasks:


    #############################################
    # HOST INFORMATION
    #############################################

    - name: IDENTIFIER - Linux Hardening Audit RAW Mode
      raw: |
        echo "Linux Hardening Audit RAW Mode Started"
      changed_when: false


    - name: Get hostname
      raw: |
        hostname
      register: raw_hostname
      changed_when: false


    - name: Get IP address
      raw: |
        hostname -I | awk '{print $1}'
      register: raw_ip
      changed_when: false


    - name: Get OS information
      raw: |
        cat /etc/os-release | grep -E '^(NAME|VERSION)=' | tr -d '"'
      register: raw_os
      changed_when: false


    - name: Display target information
      debug:
        msg:
          - "================================="
          - "Inventory : {{ inventory_hostname }}"
          - "Hostname  : {{ raw_hostname.stdout | trim }}"
          - "IP        : {{ raw_ip.stdout | trim }}"
          - "OS        : {{ raw_os.stdout_lines }}"
          - "================================="



    #############################################
    # CREATE WORK DIRECTORY
    #############################################

    - name: Create working directory
      raw: |
        mkdir -p {{ remote_script_dir }}
      changed_when: false



    #############################################
    # COPY SCRIPT TO TARGET
    #############################################

    - name: Check script existing
      raw: |
        test -f {{ remote_script }} && echo EXISTS || echo MISSING
      register: script_check
      changed_when: false


    - name: Copy hardening script
      raw: |
        echo '{{ lookup("file", "files/" + script_name) | b64encode }}' | base64 -d > {{ remote_script }}
        chmod 0755 {{ remote_script }}
      when:
        - "'MISSING' in script_check.stdout"



    - name: Verify script
      raw: |
        test -f {{ remote_script }} && echo EXISTS || echo FAILED
      register: script_verify
      changed_when: false



    - name: Stop if script missing
      fail:
        msg: "Script tidak ditemukan {{ remote_script }}"
      when:
        - "'FAILED' in script_verify.stdout"



    #############################################
    # EXECUTE HARDENING SCRIPT
    #############################################

    - name: Execute hardening script
      raw: |
        cd {{ remote_script_dir }}
        {{ remote_script }}
      register: hardening_result
      changed_when: true



    - name: Show script output
      debug:
        var: hardening_result.stdout_lines



    - name: Show script error
      debug:
        var: hardening_result.stderr_lines
      when:
        - hardening_result.stderr | default('') | length > 0



    #############################################
    # DETECT REPORT
    #############################################

    - name: Detect generated report
      raw: |
        find {{ remote_script_dir }} -maxdepth 1 -type f -name "*.txt" | tail -1
      register: detected_report
      changed_when: false



    - name: Validate report exists
      fail:
        msg: "Report TXT tidak ditemukan setelah script selesai"
      when:
        - detected_report.stdout | trim == ""



    #############################################
    # RENAME REPORT
    #############################################

    - name: Rename report
      raw: |
        mv "{{ detected_report.stdout | trim }}" "{{ report_path }}"


    - name: Verify report
      raw: |
        test -f {{ report_path }} && echo EXISTS || echo FAILED
      register: report_verify
      changed_when: false


    - name: Stop if report failed
      fail:
        msg: "Rename report gagal {{ report_path }}"
      when:
        - "'FAILED' in report_verify.stdout"



    #############################################
    # DISPLAY REPORT TO AWX
    #############################################

    - name: Read report
      raw: |
        cat {{ report_path }}
      register: report_content
      changed_when: false



    - name: Display hardening report
      debug:
        var: report_content.stdout_lines

    #############################################
    # PREPARE STORAGE HOST (lst-svr-henry)
    #############################################

    - name: Create storage directory on lst-svr-henry
      delegate_to: "{{ storage_host }}"
      raw: |
        mkdir -p {{ local_report_dir }}
      changed_when: false



    #############################################
    # TRANSFER REPORT VIA AWX
    # Tidak menggunakan scp antar VM
    #############################################

    - name: Save report to lst-svr-henry storage
      delegate_to: "{{ storage_host }}"
      copy:
        content: "{{ report_content.stdout }}"
        dest: "{{ local_report_path }}"
        mode: "0644"



    - name: Verify report on storage host
      delegate_to: "{{ storage_host }}"
      raw: |
        test -f {{ local_report_path }} && echo EXISTS || echo FAILED
      register: storage_report_verify
      changed_when: false



    - name: Stop if storage copy failed
      fail:
        msg: "Report gagal disimpan di {{ storage_host }}"
      when:
        - "'FAILED' in storage_report_verify.stdout"



    #############################################
    # UPLOAD TO MINIO FROM lst-svr-henry
    #############################################

    - name: Check mc binary
      delegate_to: "{{ storage_host }}"
      raw: |
        test -x {{ mc_binary_path }} && echo EXISTS || echo FAILED
      register: mc_check
      changed_when: false



    - name: Stop if mc not found
      fail:
        msg: "mc tidak ditemukan di {{ storage_host }}"
      when:
        - "'FAILED' in mc_check.stdout"



    - name: Upload report to MinIO
      delegate_to: "{{ storage_host }}"
      raw: |
        {{ mc_binary_path }} cp \
        {{ local_report_path }} \
        {{ minio_alias }}/{{ minio_bucket }}/{{ report_name }}
      register: minio_upload
      changed_when: true



    - name: Show MinIO upload result
      debug:
        var: minio_upload.stdout_lines



    #############################################
    # VERIFY MINIO OBJECT
    #############################################

    - name: Verify MinIO object
      delegate_to: "{{ storage_host }}"
      raw: |
        {{ mc_binary_path }} stat \
        {{ minio_alias }}/{{ minio_bucket }}/{{ report_name }}
      register: minio_verify
      changed_when: false



    - name: Fail if MinIO verification failed
      fail:
        msg: "Upload MinIO gagal untuk {{ report_name }}"
      when:
        - minio_verify.rc != 0



    #############################################
    # CLEANUP TARGET
    #
    # Hanya hapus script
    # Jangan hapus report
    #############################################

    - name: Remove script from target
      raw: |
        rm -f {{ remote_script }}
      changed_when: true



    #############################################
    # SUMMARY
    #############################################

    - name: Job Summary
      debug:
        msg:
          - "================================="
          - "STATUS       : SUCCESS"
          - "HOST         : {{ inventory_hostname }}"
          - "REPORT       : {{ report_name }}"
          - "STORAGE HOST : {{ storage_host }}"
          - "LOCAL FILE   : {{ local_report_path }}"
          - "BUCKET       : {{ minio_bucket }}"
          - "UPLOAD       : SUCCESS"
          - "================================="