---
- name: Linux Hardening Audit Raw Mode - MinIO Upload
  hosts: all
  become: true
  gather_facts: false

  vars:

    #############################################
    # HARDENING SCRIPT
    #############################################

    script_name: linux_hardening_audit2.sh

    remote_script_dir: /opt/linux_hardening_audit2_temp

    remote_script: "{{ remote_script_dir }}/{{ script_name }}"

    #############################################
    # REPORT
    #############################################

    report_dir: /opt/linux_hardening_audit2_temp

    #############################################
    # STORAGE HOST
    #############################################

    storage_host: lst-svr-henry

    storage_report_dir: /opt/linux_hardening_audit2_temp


    #############################################
    # MINIO
    #############################################

    mc_binary_path: /usr/local/bin/mc

    minio_alias:
      minio-server-hardening-linux

    minio_bucket:
      hardening-linux


  tasks:

    #############################################
    # IDENTIFY HOST
    #############################################

    - name: Get hostname
      raw: hostname
      register: hostname_result
      changed_when: false


    - name: Get IP
      raw: hostname -I | awk '{print $1}'
      register: ip_result
      changed_when: false


    - name: Get OS
      raw: |
        cat /etc/os-release | grep -E '^(NAME|VERSION)='
      register: os_result
      changed_when: false


    - name: Show host information
      debug:
        msg:
          - "=============================="
          - "Inventory : {{ inventory_hostname }}"
          - "Hostname  : {{ hostname_result.stdout | trim }}"
          - "IP        : {{ ip_result.stdout | trim }}"
          - "OS        : {{ os_result.stdout_lines }}"
          - "=============================="


    #############################################
    # CREATE WORKDIR
    #############################################

    - name: Create working directory
      raw: |
        mkdir -p {{ remote_script_dir }}
      changed_when: false



    #############################################
    # COPY SCRIPT
    #############################################

    - name: Check script existing
      raw: |
        test -f {{ remote_script }} && echo EXISTS || echo MISSING
      register: script_check
      changed_when: false


    - name: Upload hardening script
      raw: |
        echo '{{ lookup("file","files/" + script_name) | b64encode }}' \
        | base64 -d > {{ remote_script }}

        chmod 0755 {{ remote_script }}

      when:
        - "'MISSING' in script_check.stdout"



    #############################################
    # EXECUTE HARDENING
    #############################################

    - name: Execute hardening script
      raw: |
        cd {{ remote_script_dir }}

        {{ remote_script }}

      register: hardening_result
      changed_when: true


    - name: Show script output
      debug:
        var: hardening_result.stdout_lines



    #############################################
    # FIND GENERATED REPORT
    #############################################

    - name: Detect generated report
      raw: |
        find {{ remote_script_dir }} \
        -maxdepth 1 \
        -type f \
        -name "*.txt" \
        | head -1

      register: detected_report

      changed_when: false



    - name: Show detected report
      debug:
        msg:
          - "Detected:"
          - "{{ detected_report.stdout | trim }}"



    - name: Validate report
      fail:
        msg: "Report tidak ditemukan"
      when:
        - detected_report.stdout | trim == ""



    #############################################
    # NORMALIZE REPORT NAME
    #############################################

    - name: Set final report name
      set_fact:

        final_report_name:
          "linux-hardening-report-{{ inventory_hostname }}-{{ lookup('pipe','date +%Y%m%d-%H%M%S') }}.txt"


        final_report_path:
          "{{ remote_script_dir }}/{{ final_report_name }}"



    - name: Move report into working directory
      raw: |
        mv "{{ detected_report.stdout | trim }}" \
        "{{ final_report_path }}"


    - name: Verify moved report
      raw: |
        test -f {{ final_report_path }} \
        && echo EXISTS \
        || echo FAILED

      register: moved_report_check

      changed_when: false



    - name: Stop if report failed
      fail:
        msg: "Report gagal dipindahkan"
      when:
        - "'FAILED' in moved_report_check.stdout"



    #############################################
    # READ REPORT
    #############################################

    - name: Read report
      raw: |
        cat {{ final_report_path }}

      register: report_content

      changed_when: false


    - name: Display report
      debug:
        var: report_content.stdout_lines

            #############################################
    # SAVE REPORT KE STORAGE HOST
    #############################################

    - name: Create storage report directory
      delegate_to: "{{ storage_host }}"
      raw: |
        mkdir -p {{ storage_report_dir }}
      changed_when: false


    - name: Send report content to storage host
      delegate_to: "{{ storage_host }}"
      copy:
        content: "{{ report_content.stdout }}"
        dest: "{{ storage_report_dir }}/{{ final_report_name }}"
        mode: "0644"



    #############################################
    # VERIFY STORAGE REPORT
    #############################################

    - name: Verify report on storage host
      delegate_to: "{{ storage_host }}"
      raw: |
        test -f {{ storage_report_dir }}/{{ final_report_name }} \
        && echo EXISTS \
        || echo FAILED

      register: storage_report_check

      changed_when: false



    - name: Fail if storage report missing
      fail:
        msg: "Report gagal disimpan di storage host {{ storage_host }}"
      when:
        - "'FAILED' in storage_report_check.stdout"



    #############################################
    # VERIFY MC EXIST
    #############################################

    - name: Check MinIO client
      delegate_to: "{{ storage_host }}"
      raw: |
        test -x {{ mc_binary_path }} \
        && echo EXISTS \
        || echo MISSING

      register: mc_check

      changed_when: false



    - name: Fail if mc missing
      fail:
        msg: >
          MinIO client tidak ditemukan di
          {{ storage_host }} :
          {{ mc_binary_path }}
      when:
        - "'MISSING' in mc_check.stdout"



    #############################################
    # UPLOAD MINIO
    #############################################

    - name: Upload report to MinIO
      delegate_to: "{{ storage_host }}"
      raw: |
        {{ mc_binary_path }} cp \
        {{ storage_report_dir }}/{{ final_report_name }} \
        {{ minio_alias }}/{{ minio_bucket }}/{{ final_report_name }}

      register: minio_upload

      changed_when: true



    - name: Show MinIO upload result
      debug:
        var: minio_upload.stdout_lines



    #############################################
    # VERIFY MINIO OBJECT
    #############################################

    - name: Verify MinIO object
      delegate_to: "{{ storage_host }}"
      raw: |
        {{ mc_binary_path }} stat \
        {{ minio_alias }}/{{ minio_bucket }}/{{ final_report_name }}

      register: minio_verify

      changed_when: false



    - name: Fail MinIO verification
      fail:
        msg: >
          Upload MinIO gagal :
          {{ final_report_name }}

      when:
        - minio_verify.rc != 0



    #############################################
    # CLEAN TARGET SCRIPT ONLY
    #############################################

    - name: Cleanup script temporary
      raw: |
        rm -f {{ remote_script }}

      changed_when: true



    #############################################
    # SUMMARY
    #############################################

    - name: Job Summary
      debug:
        msg:

          - "======================================"
          - "STATUS       : SUCCESS"
          - "HOST         : {{ inventory_hostname }}"
          - "REPORT       : {{ final_report_name }}"
          - "STORAGE HOST : {{ storage_host }}"
          - "BUCKET       : {{ minio_bucket }}"
          - "UPLOAD       : SUCCESS"
          - "======================================"