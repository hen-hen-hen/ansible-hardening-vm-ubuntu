---

- name: Linux Hardening Audit RAW Mode - MinIO Upload
  hosts: all
  become: true
  gather_facts: false

  vars:

    #############################################
    # Script Hardening
    #############################################

    script_name: linux_hardening_audit2.sh

    remote_script_dir: /opt/linux_hardening_audit2_temp

    remote_script: "{{ remote_script_dir }}/{{ script_name }}"


    #############################################
    # Storage VM Ansible
    #############################################

    local_report_dir: "/opt/linux_hardening_audit2_temp"

    local_report_path: "{{ local_report_dir }}/{{ inventory_hostname }}-hardening-report.txt"


    #############################################
    # MinIO
    #############################################

    minio_alias: "minio-server-hardening-linux"

    minio_bucket: "hardening-linux"

    mc_binary_path: "/usr/local/bin/mc"



  tasks:


    #############################################
    # IDENTIFIER
    #############################################

    - name: IDENTIFIER - Linux Hardening Audit RAW Mode
      raw: |
        echo "Linux Hardening Audit RAW Mode Started"
      changed_when: false



    #############################################
    # HOST INFORMATION
    #############################################

    - name: Get hostname
      raw: hostname
      register: raw_hostname
      changed_when: false


    - name: Get IP address
      raw: "hostname -I | awk '{print $1}'"
      register: raw_ip
      changed_when: false


    - name: Get OS information
      raw: |
        cat /etc/os-release | grep -E '^(NAME|VERSION)=' | tr -d '"'
      register: raw_os
      changed_when: false



    - name: Display host information
      debug:
        msg:
          - "================================="
          - "Inventory : {{ inventory_hostname }}"
          - "Hostname  : {{ raw_hostname.stdout | trim }}"
          - "IP        : {{ raw_ip.stdout | trim }}"
          - "OS        : {{ raw_os.stdout_lines }}"
          - "================================="



    #############################################
    # CREATE WORK DIRECTORY
    #############################################

    - name: Create working directory
      raw: |
        mkdir -p {{ remote_script_dir }}
      changed_when: false



    #############################################
    # COPY SCRIPT RAW BASE64
    #############################################

    - name: Check script existing
      raw: |
        test -f {{ remote_script }} && echo EXISTS || echo MISSING
      register: script_check
      changed_when: false



    - name: Copy hardening script
      raw: |
        echo '{{ lookup("file", "files/" + script_name) | b64encode }}' \
        | base64 -d > {{ remote_script }}

        chmod 0755 {{ remote_script }}

      when:
        - "'MISSING' in script_check.stdout"



    - name: Verify script
      raw: |
        test -f {{ remote_script }} && echo EXISTS || echo FAILED
      register: script_verify
      changed_when: false



    - name: Fail if script missing
      fail:
        msg: "Script tidak ditemukan {{ remote_script }}"
      when:
        - "'FAILED' in script_verify.stdout"



    #############################################
    # EXECUTE SCRIPT
    #############################################

    - name: Execute hardening script
      raw: |
        cd {{ remote_script_dir }}

        {{ remote_script }}

      register: hardening_result
      changed_when: true
      failed_when: hardening_result.rc != 0



    - name: Show script output
      debug:
        var: hardening_result.stdout_lines



    - name: Show script error
      debug:
        var: hardening_result.stderr_lines
      when:
        - hardening_result.stderr | length > 0



    #############################################
    # FIND REAL REPORT CREATED BY SCRIPT
    #############################################

    - name: Detect generated TXT report
      raw: |
        find {{ remote_script_dir }} \
        -maxdepth 1 \
        -type f \
        -name "*.txt" \
        -printf "%T@ %p\n" \
        | sort -nr \
        | head -1 \
        | cut -d' ' -f2-
      register: detected_report
      changed_when: false



    - name: Show detected report
      debug:
        msg:
          - "Detected report:"
          - "{{ detected_report.stdout | trim }}"



    - name: Validate report exists
      fail:
        msg: "Report TXT tidak ditemukan"
      when:
        - detected_report.stdout | trim == ""



    #############################################
    # SAVE REAL REPORT PATH
    #############################################

    - name: Set report variable
      set_fact:

        real_report_path: "{{ detected_report.stdout | trim }}"

        real_report_name: "{{ detected_report.stdout | trim | basename }}"

            #############################################
    # READ REPORT
    #############################################

    - name: Read report content
      raw: |
        cat "{{ real_report_path }}"
      register: report_content
      changed_when: false


    - name: Display hardening report
      debug:
        var: report_content.stdout_lines



    #############################################
    # PREPARE LOCAL STORAGE
    #############################################

    - name: Create local report directory
      delegate_to: localhost
      file:
        path: "{{ local_report_dir }}"
        state: directory
        mode: "0755"



    #############################################
    # SAVE REPORT TO ANSIBLE VM
    #############################################

    - name: Save report to Ansible VM
      delegate_to: localhost
      copy:
        content: "{{ report_content.stdout }}"
        dest: "{{ local_report_path }}"
        mode: "0644"



    - name: Verify local report exists
      delegate_to: localhost
      stat:
        path: "{{ local_report_path }}"
      register: local_report_check



    - name: Fail if local report missing
      fail:
        msg: "Report gagal disimpan di VM Ansible"
      when:
        - not local_report_check.stat.exists



    #############################################
    # UPLOAD TO MINIO
    #############################################

    - name: Upload report to MinIO
      delegate_to: localhost
      command: >
        {{ mc_binary_path }} cp
        {{ local_report_path }}
        {{ minio_alias }}/{{ minio_bucket }}/{{ real_report_name }}

      register: minio_upload

      failed_when:
        - minio_upload.rc != 0



    - name: Show MinIO upload result
      delegate_to: localhost
      debug:
        var: minio_upload.stdout_lines



    #############################################
    # VERIFY MINIO OBJECT
    #############################################

    - name: Verify MinIO object
      delegate_to: localhost
      command: >
        {{ mc_binary_path }} stat
        {{ minio_alias }}/{{ minio_bucket }}/{{ real_report_name }}

      register: minio_verify

      changed_when: false



    - name: Fail if MinIO verification failed
      fail:
        msg: >
          Upload MinIO gagal:
          {{ real_report_name }}

      when:
        - minio_verify.rc != 0



    #############################################
    # CLEAN TARGET
    #############################################

    - name: Cleanup script only
      raw: |
        rm -f {{ remote_script }}
      changed_when: true



    #############################################
    # SUMMARY
    #############################################

    - name: Job Summary
      debug:
        msg:
          - "================================="
          - "STATUS       : SUCCESS"
          - "HOST         : {{ inventory_hostname }}"
          - "REPORT       : {{ real_report_name }}"
          - "LOCAL STORE  : {{ local_report_path }}"
          - "MINIO BUCKET : {{ minio_bucket }}"
          - "UPLOAD       : SUCCESS"
          - "================================="