---
- name: Linux Hardening Audit RAW Mode - MinIO Upload
  hosts: hardening_target
  become: true
  gather_facts: false

  any_errors_fatal: false
  max_fail_percentage: 100

  vars:

    #############################################
    # Script Hardening
    #############################################

    script_name: linux_hardening_audit2.sh

    remote_script_dir: /opt/linux_hardening_audit2_temp

    remote_script: "{{ remote_script_dir }}/{{ script_name }}"

    report_name: "hardening-{{ inventory_hostname }}-{{ lookup('pipe', 'date +%Y%m%d_%H%M%S') }}.txt"

    report_path: "{{ remote_script_dir }}/{{ report_name }}"


    #############################################
    # VM Ansible (Storage + mc host)
    #############################################

    storage_host: "lst-svr-henry"

    local_report_dir: "/opt/linux_hardening_audit2_temp"

    local_report_path: "{{ local_report_dir }}/{{ report_name }}"


    #############################################
    # MinIO
    #############################################

    minio_endpoint: "http://10.64.1.2:9000"

    minio_bucket: "hardening-linux"

    minio_alias: "minio-server-hardening-linux"

    mc_binary_path: "/usr/local/bin/mc"

    mc_download_url: "https://dl.min.io/client/mc/release/linux-amd64/mc"


    #############################################
    # Credential AWX
    #############################################

    minio_access_key: "{{ vault_minio_access_key }}"

    minio_secret_key: "{{ vault_minio_secret_key }}"


  pre_tasks:


    - name: Identifier
      raw: |
        echo "Linux Hardening Audit RAW Mode"

      changed_when: false


    - name: Get hostname
      raw: |
        hostname

      register: raw_hostname

      changed_when: false


    - name: Get IP
      raw: |
        hostname -I | awk '{print $1}'

      register: raw_ip

      changed_when: false


    - name: Get OS
      raw: |
        cat /etc/os-release |
        grep -E '^(NAME|VERSION)' |
        tr -d '"'

      register: raw_os

      changed_when: false


    - name: Get timestamp
      raw: |
        date '+%F %T'

      register: raw_timestamp

      changed_when: false


    - name: Display information
      debug:
        msg:
          - "================================="
          - "Inventory : {{ inventory_hostname }}"
          - "Hostname  : {{ raw_hostname.stdout | trim }}"
          - "IP        : {{ raw_ip.stdout | trim }}"
          - "OS        : {{ raw_os.stdout_lines }}"
          - "Time      : {{ raw_timestamp.stdout | trim }}"
          - "================================="



  tasks:


    - name: Linux Hardening Audit

      block:


        #########################################
        # CREATE WORKING DIRECTORY
        #########################################

        - name: Create working directory
          raw: |
            mkdir -p {{ remote_script_dir }}



        #########################################
        # COPY SCRIPT
        #########################################

        - name: Copy hardening script

          raw: |
            echo '{{ lookup("file", "files/" + script_name) | b64encode }}' |
            base64 -d > {{ remote_script }}

            chmod 0755 {{ remote_script }}



        - name: Verify script

          raw: |
            test -f {{ remote_script }} && echo OK || echo FAILED

          register: script_verify

          changed_when: false



        - name: Fail if script missing

          fail:

            msg: "Script tidak ditemukan {{ remote_script }}"

          when:

            - "'FAILED' in script_verify.stdout"



        #########################################
        # EXECUTE SCRIPT
        #########################################

        - name: Execute hardening script

          raw: |
            cd {{ remote_script_dir }}

            {{ remote_script }}

          register: audit_result



        - name: Show audit output

          debug:

            var: audit_result.stdout_lines

        #########################################
        # DETECT TXT REPORT TERBARU
        #########################################

        - name: Detect latest TXT report

          raw: |
            find {{ remote_script_dir }} \
            -maxdepth 1 \
            -type f \
            -name "*.txt" \
            -printf "%T@ %p\n" |
            sort -nr |
            head -1 |
            cut -d' ' -f2-

          register: detected_report

          changed_when: false



        - name: Check report detected

          fail:

            msg: "Report TXT tidak ditemukan"

          when:

            - detected_report.stdout | trim == ""



        - name: Show detected report

          debug:

            msg:

              - "Detected report:"
              - "{{ detected_report.stdout | trim }}"



        #########################################
        # RENAME REPORT
        #########################################

        - name: Rename report

          raw: |
            mv "{{ detected_report.stdout | trim }}" "{{ report_path }}"



        - name: Verify report

          raw: |
            test -f {{ report_path }} && echo OK || echo FAILED

          register: report_verify

          changed_when: false



        - name: Stop if report rename failed

          fail:

            msg: "Rename report gagal"

          when:

            - "'FAILED' in report_verify.stdout"



        #########################################
        # READ REPORT
        #########################################

        - name: Read report

          raw: |
            cat {{ report_path }}

          register: report_content

          changed_when: false



        - name: Show report on AWX

          debug:

            msg: "{{ report_content.stdout_lines }}"



        #########################################
        # COPY REPORT TO STORAGE HOST
        #########################################

        - name: Copy report to lst-svr-henry

          raw: |
            scp \
            -o StrictHostKeyChecking=no \
            {{ report_path }} \
            {{ storage_host }}:{{ local_report_path }}

          register: copy_report



        - name: Verify report on storage

          delegate_to: "{{ storage_host }}"

          raw: |
            test -f {{ local_report_path }} && echo OK || echo FAILED

          register: storage_verify

          changed_when: false



        - name: Stop if copy failed

          fail:

            msg: "Report gagal dicopy ke {{ storage_host }}"

          when:

            - "'FAILED' in storage_verify.stdout"



        #########################################
        # UPLOAD MINIO
        #########################################

        - name: Upload report to MinIO

          delegate_to: "{{ storage_host }}"

          raw: |
            {{ mc_binary_path }} cp \
            {{ local_report_path }} \
            {{ minio_alias }}/{{ minio_bucket }}/{{ report_name }}

          register: minio_upload



        - name: Show MinIO result

          debug:

            var: minio_upload.stdout_lines



        #########################################
        # VERIFY MINIO
        #########################################

        - name: Verify MinIO object

          delegate_to: "{{ storage_host }}"

          raw: |
            {{ mc_binary_path }} stat \
            {{ minio_alias }}/{{ minio_bucket }}/{{ report_name }}

          register: minio_verify

          changed_when: false



        - name: Fail MinIO verification

          fail:

            msg: "Upload MinIO gagal {{ report_name }}"

          when:

            - minio_verify.rc != 0



        #########################################
        # SUMMARY
        #########################################

        - name: Summary

          debug:

            msg:

              - "================================="
              - "STATUS       : SUCCESS"
              - "HOST         : {{ inventory_hostname }}"
              - "REPORT       : {{ report_name }}"
              - "STORAGE HOST : {{ storage_host }}"
              - "BUCKET       : {{ minio_bucket }}"
              - "UPLOAD       : SUCCESS"
              - "================================="



      #########################################
      # RESCUE
      #########################################

      rescue:


        - name: Show Error

          debug:

            msg:

              - "================================="
              - "STATUS : FAILED"
              - "HOST   : {{ inventory_hostname }}"
              - "TASK   : Linux Hardening Audit"
              - "================================="



      #########################################
      # ALWAYS
      #########################################

      always:


        #######################################
        # CLEAN SCRIPT ONLY
        #######################################

        - name: Cleanup script only

          raw: |
            rm -f {{ remote_script }}

          changed_when: false



        #######################################
        # KEEP REPORT
        #######################################

        - name: Keep report information

          debug:

            msg:

              - "Report tidak dihapus"
              - "Target : {{ report_path }}"
              - "Storage : {{ local_report_path }}"            