---
- name: Linux Hardening Audit (Raw Mode - Storage & Upload via VM Ansible)
  hosts: all
  become: true
  gather_facts: false

  vars:

    #############################################
    # Script Hardening
    #############################################

    script_name: linux_hardening_audit2.sh
    remote_script_dir: /opt/linux_hardening_audit2_temp
    remote_script: "{{ remote_script_dir }}/{{ script_name }}"

    report_name: "hardening-{{ inventory_hostname }}-{{ lookup('pipe', 'date +%F_%H-%M-%S') }}.txt"
    report_path: "{{ remote_script_dir }}/{{ report_name }}"

    #############################################
    # VM Ansible (Storage + mc host)
    # NOTE PENTING: SEMUA task penyimpanan laporan &
    # upload mc sekarang dijalankan DI VM INI (bukan
    # di AWX Execution Environment/"localhost"), lewat
    # raw (host ini juga tidak punya Python).
    # GANTI nilai di bawah kalau inventory hostname-nya
    # bukan "lst-svr-henry".
    #############################################

    storage_host: "lst-svr-henry"
    local_report_dir: "/opt/linux_hardening_audit2_temp"
    local_report_path: "{{ local_report_dir }}/hardening-{{ inventory_hostname }}-report.txt"

    #############################################
    # MinIO Client (mc) - sudah terinstall manual
    # di storage_host (10.80.0.21). Kalau ternyata
    # belum ada, task di bawah otomatis install.
    #############################################

    minio_endpoint: "http://10.64.1.2:9000"
    minio_bucket: "hardening-linux"
    minio_alias: "minio-server-hardening-linux"

    mc_binary_path: "/usr/local/bin/mc"
    mc_download_url: "https://dl.min.io/client/mc/release/linux-amd64/mc"

    # Simpan di AWX Credential / Extra Variables (jangan hardcode plaintext)
    minio_access_key: "{{ vault_minio_access_key }}"
    minio_secret_key: "{{ vault_minio_secret_key }}"

  tasks:

#########################################################################
# HOST INFORMATION (RAW, TANPA GATHER FACTS)
#########################################################################

    - name: IDENTIFIER - Linux Hardening Audit (raw mode)
      raw: 'echo "Playbook loaded - Linux Hardening Audit (raw mode)"'
      changed_when: false

    - name: Get hostname (raw)
      raw: hostname
      register: raw_hostname
      changed_when: false

    - name: Get IP address (raw)
      raw: "hostname -I | awk '{print $1}'"
      register: raw_ip
      changed_when: false

    - name: Get OS info (raw)
      raw: "cat /etc/os-release | grep -E '^(NAME|VERSION)=' | tr -d '\"'"
      register: raw_os
      changed_when: false

    - name: Display target information
      debug:
        msg:
          - "========================================"
          - "Inventory : {{ inventory_hostname }}"
          - "Hostname  : {{ raw_hostname.stdout | trim }}"
          - "IP        : {{ raw_ip.stdout | trim }}"
          - "OS        : {{ raw_os.stdout_lines | default([]) }}"
          - "========================================"

#########################################################################
# CREATE WORKING DIRECTORY (TARGET HOST)
#########################################################################

    - name: Create working directory on target
      raw: "mkdir -p {{ remote_script_dir }}"
      changed_when: false

#########################################################################
# ENSURE SCRIPT EXISTS ON TARGET (RAW, TRANSFER HANYA JIKA BELUM ADA)
#########################################################################

    - name: Check if hardening script already exists on target (raw)
      raw: "test -f {{ remote_script }} && echo EXISTS || echo MISSING"
      register: script_check_before
      changed_when: false

    - name: Transfer hardening script to target (raw, base64)
      raw: >
        echo '{{ lookup('file', 'files/' + script_name) | b64encode }}'
        | base64 -d > {{ remote_script }} && chmod 0755 {{ remote_script }}
      when: "'MISSING' in script_check_before.stdout"
      changed_when: true

    - name: Verify hardening script exists after transfer (raw)
      raw: "test -f {{ remote_script }} && echo EXISTS || echo MISSING"
      register: script_check_after
      changed_when: false

    - name: Stop if hardening script still not found
      fail:
        msg: >
          Script hardening tidak ditemukan/berhasil ditransfer ke
          {{ remote_script }} pada host {{ inventory_hostname }}.
      when: "'MISSING' in script_check_after.stdout"

    - name: Ensure script is executable (raw)
      raw: "chmod 0755 {{ remote_script }}"
      changed_when: false

#########################################################################
# EXECUTE SCRIPT (RAW)
#########################################################################

    - name: Execute hardening script (raw)
      raw: "{{ remote_script }} {{ report_path }}"
      register: hardening
      changed_when: true
      ignore_errors: true
      ignore_unreachable: true

    - name: Show script output
      debug:
        var: hardening.stdout_lines
      when: hardening.stdout_lines is defined

    - name: Show script error
      debug:
        var: hardening.stderr_lines
      when:
        - hardening.stderr is defined
        - hardening.stderr | default('') | length > 0

#########################################################################
# READ REPORT FROM TARGET (RAW, ANTI-DISCONNECT & WILDCARD)
#########################################################################

    - name: Read report content from target (raw with retry)
      raw: "cat {{ remote_script_dir }}/hardening-{{ inventory_hostname }}-*.txt"
      register: report_raw_content
      until: report_raw_content.rc is defined and report_raw_content.rc == 0
      retries: 15
      delay: 10
      ignore_errors: true
      changed_when: false

    - name: Stop if report missing or unreadable
      fail:
        msg: "Hardening report was not generated."
      when: report_raw_content.rc is not defined or report_raw_content.rc != 0

    - name: Display report (raw)
      debug:
        var: report_raw_content.stdout_lines

#########################################################################
# TARIK FILE LAPORAN KE VM ANSIBLE (STORAGE_HOST) VIA RAW SCP (BEBAS PYTHON)
#########################################################################

    - name: Ensure local temp directory exists on VM Ansible (storage_host)
      delegate_to: "{{ storage_host }}"
      raw: "mkdir -p {{ local_report_dir }} && chmod 0777 {{ local_report_dir }}"
      changed_when: false

    - name: Download report file from target to VM Ansible using raw scp
      delegate_to: "{{ storage_host }}"
      # Perintah scp mentah dijalankan langsung dari sisi storage_host (VM Ansible)
      # Memanfaatkan biner sshpass bawaan sistem untuk memasukkan password otomatis
      raw: >
        sshpass -p "{{ ansible_password }}" 
        scp -o StrictHostKeyChecking=no -P {{ ansible_port | default(22) }}
        {{ ansible_user }}@{{ inventory_hostname }}:/opt/linux_hardening_audit2_temp/hardening-{{ inventory_hostname }}-*.txt 
        {{ local_report_path }}
      changed_when: true
            # Ditambahkan agar jika zabbixserver masih down, playbook tetap lanjut memproses lst-srv-henry sampai MinIO
      ignore_unreachable: true


#########################################################################
# ENSURE MC CLIENT READY DI VM ANSIBLE (STORAGE_HOST, RAW)
#########################################################################

    - name: Check if mc binary already exists on storage_host (raw)
      delegate_to: "{{ storage_host }}"
      raw: "test -f {{ mc_binary_path }} && echo EXISTS || echo MISSING"
      register: mc_check
      changed_when: false

    - name: Download mc binary on storage_host (raw, jika belum ada)
      delegate_to: "{{ storage_host }}"
      raw: >
        curl -fsSL {{ mc_download_url }} -o {{ mc_binary_path }}
        && chmod 0755 {{ mc_binary_path }}
      register: mc_download_result
      until: mc_download_result.rc is defined and mc_download_result.rc == 0
      retries: 5
      delay: 10
      when: "'MISSING' in mc_check.stdout"
      changed_when: true

    - name: Verify mc client version on storage_host (raw)
      delegate_to: "{{ storage_host }}"
      raw: "{{ mc_binary_path }} --version"
      register: mc_version
      changed_when: false

    - name: Show mc client version
      debug:
        var: mc_version.stdout_lines

    - name: Set mc alias for MinIO endpoint on storage_host (raw)
      delegate_to: "{{ storage_host }}"
      raw: >
        {{ mc_binary_path }} alias set {{ minio_alias }}
        {{ minio_endpoint }} {{ minio_access_key }} {{ minio_secret_key }}
      changed_when: true
      no_log: true

#########################################################################
# VALIDATE DUPLICATE BEFORE UPLOAD (RAW DI STORAGE_HOST)
#########################################################################

    # Catatan: perbandingan checksum ini akurat untuk file yang diupload
    # sebagai single-part (mc cp untuk file kecil seperti .txt selalu
    # single-part), karena ETag = MD5 pada kondisi tersebut.

    - name: Compute local report checksum on storage_host (raw, md5sum)
      delegate_to: "{{ storage_host }}"
      raw: "md5sum {{ local_report_path }} | awk '{print $1}'"
      register: local_report_md5
      changed_when: false

    - name: Check if report already exists in MinIO bucket (raw)
      delegate_to: "{{ storage_host }}"
      raw: "{{ mc_binary_path }} stat {{ minio_alias }}/{{ minio_bucket }}/{{ report_name }}"
      register: mc_remote_stat
      changed_when: false
      failed_when: false

    - name: Extract remote ETag (jika object sudah ada)
      set_fact:
        remote_etag: "{{ (mc_remote_stat.stdout | regex_search('ETag\\s*:\\s*([a-f0-9]+)', '\\1') | first) | default('') }}"
      when: mc_remote_stat.rc is defined and mc_remote_stat.rc == 0

    - name: Determine duplicate status
      set_fact:
        is_duplicate: >-
          {{
            (mc_remote_stat.rc is defined and mc_remote_stat.rc == 0)
            and (remote_etag | default('') == (local_report_md5.stdout | trim))
          }}

    - name: Show duplicate skip message
      debug:
        msg: "File {{ report_name }} sudah ada di bucket dengan checksum identik, upload dilewati (SKIP)."
      when: is_duplicate

#########################################################################
# UPLOAD REPORT TO MINIO USING MC (RAW - LANGSUNG KE ENDPOINT URL)
#########################################################################

    - name: Upload report to MinIO using mc (raw)
      delegate_to: "{{ storage_host }}"
      # Kita langsung tembak URL MinIO Server-nya tanpa membuat alias terlebih dahulu
      # Ganti minio_endpoint_url, minio_access_key, dan minio_secret_key dengan variabel asli Anda
      raw: >
        mc cp --insecure "{{ local_report_path }}" 
        "http://{{ minio_access_key }}:{{ minio_secret_key }}@10.64.1.2:9000/{{ minio_bucket }}/{{ report_name }}"
      register: upload_result
      changed_when: true
      when: not is_duplicate


    - name: Show upload result
      debug:
        var: upload_result.stdout_lines
      when: not is_duplicate

#########################################################################
# VERIFY UPLOAD (RAW DI STORAGE_HOST)
#########################################################################

    - name: Verify object exists in MinIO bucket (raw)
      delegate_to: "{{ storage_host }}"
      raw: "{{ mc_binary_path }} stat {{ minio_alias }}/{{ minio_bucket }}/{{ report_name }}"
      register: mc_stat_result
      changed_when: false
      failed_when: false

    - name: Upload validation
      fail:
        msg: "Upload report ke MinIO gagal untuk {{ report_name }}."
      when: mc_stat_result.rc is not defined or mc_stat_result.rc != 0

#########################################################################
# CLEANUP REMOTE (RAW, TARGET HOST)
#########################################################################

    - name: Remove working directory from target (raw)
      raw: "rm -rf {{ remote_script_dir }}"
      changed_when: true

#########################################################################
# NOTE: LOCAL REPORT FILE
#########################################################################

    # File laporan di storage_host ({{ local_report_path }}) sengaja
    # TIDAK dihapus, supaya tetap tersimpan permanen di VM Ansible.

#########################################################################
# SUCCESS
#########################################################################

    - name: Job Summary
      debug:
        msg:
          - "========================================"
          - "HOSTNAME     : {{ raw_hostname.stdout | trim }}"
          - "STATUS       : SUCCESS"
          - "STORAGE HOST : {{ storage_host }}"
          - "LOCAL REPORT : {{ local_report_path }}"
          - "BUCKET       : {{ minio_bucket }}"
          - "MINIO ALIAS  : {{ minio_alias }}"
          - "UPLOAD       : {{ 'SKIPPED (DUPLICATE)' if is_duplicate else 'SUCCESS' }}"
          - "========================================"