---
- name: Linux Hardening Audit (Raw Mode - Tanpa Python di Target)
  hosts: all
  become: true
  gather_facts: false

  vars:

    #############################################
    # Script Hardening
    # NOTE: jika script sudah ada di host target,
    # transfer akan di-skip otomatis (idempoten)
    #############################################

    script_name: linux_hardening_audit2.sh
    remote_script_dir: /opt/linux_hardening_audit2_temp
    remote_script: "{{ remote_script_dir }}/{{ script_name }}"

    # inventory_hostname dipakai (bukan ansible_hostname),
    # karena gather_facts dimatikan sehingga ansible_hostname
    # tidak tersedia.
    report_name: "hardening-{{ inventory_hostname }}-{{ lookup('pipe', 'date +%F_%H-%M-%S') }}.txt"
    report_path: "{{ remote_script_dir }}/{{ report_name }}"

    #############################################
    # Penyimpanan Lokal di VM Ansible
    #############################################

    local_report_dir: "/opt/linux_hardening_audit2_temp"
    local_report_path: "{{ local_report_dir }}/{{ report_name }}"

    #############################################
    # MinIO Client (mc)
    # NOTE: mc sudah diinstall & alias sudah dikonfigurasi
    # manual di VM Ansible ini, contoh:
    #   mc alias set minio-server-hardening-linux \
    #     http://10.64.1.2:9000 <access_key> <secret_key>
    #############################################

    minio_bucket: "hardening-linux"
    minio_alias: "minio-server-hardening-linux"

    mc_binary_path: "/usr/local/bin/mc"

  tasks:

#########################################################################
# HOST INFORMATION (RAW, TANPA GATHER FACTS)
#########################################################################

    - name: IDENTIFIER - Linux Hardening Audit (raw mode)
      raw: 'echo "Playbook loaded - Linux Hardening Audit (raw mode)"'
      changed_when: false

    - name: Get hostname (raw)
      raw: hostname
      register: raw_hostname
      changed_when: false

    - name: Get IP address (raw)
      raw: "hostname -I | awk '{print $1}'"
      register: raw_ip
      changed_when: false

    - name: Get OS info (raw)
      raw: "cat /etc/os-release | grep -E '^(NAME|VERSION)=' | tr -d '\"'"
      register: raw_os
      changed_when: false

    - name: Display target information
      debug:
        msg:
          - "========================================"
          - "Inventory : {{ inventory_hostname }}"
          - "Hostname  : {{ raw_hostname.stdout | trim }}"
          - "IP        : {{ raw_ip.stdout | trim }}"
          - "OS        : {{ raw_os.stdout_lines | default([]) }}"
          - "========================================"

#########################################################################
# CREATE WORKING DIRECTORY
#########################################################################

    - name: Create working directory
      raw: "mkdir -p {{ remote_script_dir }}"
      changed_when: false

#########################################################################
# ENSURE SCRIPT EXISTS ON TARGET (RAW, TRANSFER HANYA JIKA BELUM ADA)
#########################################################################

    - name: Check if hardening script already exists on target (raw)
      raw: "test -f {{ remote_script }} && echo EXISTS || echo MISSING"
      register: script_check_before
      changed_when: false

    # Transfer file dilakukan dengan encode isi script lokal (di control
    # node) jadi base64, lalu di-decode kembali langsung di sisi target
    # lewat raw command. Ini menggantikan modul "copy" yang butuh Python.
    - name: Transfer hardening script to target (raw, base64)
      raw: >
        echo '{{ lookup('file', 'files/' + script_name) | b64encode }}'
        | base64 -d > {{ remote_script }} && chmod 0755 {{ remote_script }}
      when: "'MISSING' in script_check_before.stdout"
      changed_when: true

    - name: Verify hardening script exists after transfer (raw)
      raw: "test -f {{ remote_script }} && echo EXISTS || echo MISSING"
      register: script_check_after
      changed_when: false

    - name: Stop if hardening script still not found
      fail:
        msg: >
          Script hardening tidak ditemukan/berhasil ditransfer ke
          {{ remote_script }} pada host {{ inventory_hostname }}.
      when: "'MISSING' in script_check_after.stdout"

    - name: Ensure script is executable (raw)
      raw: "chmod 0755 {{ remote_script }}"
      changed_when: false

#########################################################################
# EXECUTE SCRIPT (RAW)
#########################################################################

    - name: Execute hardening script (raw)
      raw: "{{ remote_script }} {{ report_path }}"
      register: hardening
      changed_when: true
      ignore_errors: true
      ignore_unreachable: true

    - name: Show script output
      debug:
        var: hardening.stdout_lines
      when: hardening.stdout_lines is defined

    - name: Show script error
      debug:
        var: hardening.stderr_lines
      when: 
        - hardening.stderr is defined
        - hardening.stderr | default('') | length > 0

#########################################################################
# TUGAS PENYELAMAT: TUNGGU SSH KEMBALI ONLINE
#########################################################################

    - name: Wait for SSH connection to recover after script execution
      delegate_to: localhost
      # Menggunakan ansible.builtin.wait_for untuk memeriksa port SSH (22) di target
      ansible.builtin.wait_for:
        host: "{{ inventory_hostname }}"
        port: 22
        delay: 5          # Beri jeda 5 detik sebelum mulai mengecek
        timeout: 120      # Batas waktu maksimal menunggu (2 menit)
        state: started

#########################################################################
# VERIFY REPORT (REMOTE, RAW)
#########################################################################

    - name: Verify report exists (raw)
      raw: "test -f {{ report_path }}"
      register: report_check
      ignore_errors: true
      changed_when: false

    - name: Stop if report missing
      fail:
        msg: "Hardening report was not generated di {{ report_path }}."
      when: report_check.rc is not defined or report_check.rc != 0

#########################################################################
# SHOW REPORT (RAW)
#########################################################################

    - name: Display report (raw)
      raw: "cat {{ report_path }}"
      register: report_content
      changed_when: false

    - debug:
        var: report_content.stdout_lines

#########################################################################
# PREPARE LOCAL STORAGE (ANSIBLE VM - PYTHON TERSEDIA DI SINI)
#########################################################################

    - name: Ensure local temp directory exists on Ansible VM
      delegate_to: localhost
      file:
        path: "{{ local_report_dir }}"
        state: directory
        mode: "0755"

#########################################################################
# FETCH REPORT TO ANSIBLE LOCAL VM (RAW CAT + LOCAL COPY)
#########################################################################

    # Modul "fetch" butuh Python di remote (via slurp), jadi diganti:
    # baca isi file lewat raw "cat", lalu simpan hasilnya ke file lokal
    # dari sisi control node (delegate_to localhost, Python tersedia).

    - name: Read report content from target (raw)
      raw: "cat {{ report_path }}"
      register: report_raw_content
      changed_when: false

    - name: Save report to local Ansible VM
      delegate_to: localhost
      copy:
        content: "{{ report_raw_content.stdout }}"
        dest: "{{ local_report_path }}"

#########################################################################
# VALIDATE DUPLICATE BEFORE UPLOAD (LOCAL, PYTHON TERSEDIA)
#########################################################################

    # Catatan: perbandingan checksum ini akurat untuk file yang diupload
    # sebagai single-part (mc cp untuk file kecil seperti .txt selalu
    # single-part), karena ETag = MD5 pada kondisi tersebut.

    - name: Compute local report checksum (md5)
      delegate_to: localhost
      stat:
        path: "{{ local_report_path }}"
        checksum_algorithm: md5
      register: local_report_stat

    - name: Check if report already exists in MinIO bucket
      delegate_to: localhost
      command: "{{ mc_binary_path }} stat {{ minio_alias }}/{{ minio_bucket }}/{{ report_name }}"
      register: mc_remote_stat
      changed_when: false
      failed_when: false

    - name: Extract remote ETag (jika object sudah ada)
      delegate_to: localhost
      set_fact:
        remote_etag: "{{ (mc_remote_stat.stdout | regex_search('ETag\\s*:\\s*([a-f0-9]+)', '\\1') | first) | default('') }}"
      when: mc_remote_stat.rc == 0

    - name: Determine duplicate status
      delegate_to: localhost
      set_fact:
        is_duplicate: "{{ (mc_remote_stat.rc == 0) and (remote_etag | default('') == local_report_stat.stat.checksum) }}"

    - name: Show duplicate skip message
      debug:
        msg: "File {{ report_name }} sudah ada di bucket dengan checksum identik, upload dilewati (SKIP)."
      when: is_duplicate

#########################################################################
# UPLOAD REPORT TO MINIO USING MC
#########################################################################

    - name: Upload report to MinIO using mc
      delegate_to: localhost
      command: >
        {{ mc_binary_path }} cp {{ local_report_path }}
        {{ minio_alias }}/{{ minio_bucket }}/{{ report_name }}
      register: upload_result
      changed_when: true
      when: not is_duplicate

    - name: Show upload result
      debug:
        var: upload_result.stdout_lines
      when: not is_duplicate

#########################################################################
# VERIFY UPLOAD (MC)
#########################################################################

    - name: Verify object exists in MinIO bucket
      delegate_to: localhost
      command: "{{ mc_binary_path }} stat {{ minio_alias }}/{{ minio_bucket }}/{{ report_name }}"
      register: mc_stat_result
      changed_when: false
      failed_when: mc_stat_result.rc != 0

    - name: Upload validation
      fail:
        msg: "Upload report ke MinIO gagal untuk {{ report_name }}."
      when: mc_stat_result.rc != 0

#########################################################################
# CLEANUP REMOTE (RAW)
#########################################################################

    - name: Remove working directory from target (raw)
      raw: "rm -rf {{ remote_script_dir }}"
      changed_when: true

#########################################################################
# NOTE: LOCAL REPORT FILE
#########################################################################

    # File laporan lokal sengaja TIDAK dihapus, karena sesuai permintaan
    # laporan harus tetap tersimpan di {{ local_report_dir }} pada VM Ansible.

#########################################################################
# SUCCESS
#########################################################################

    - name: Job Summary
      debug:
        msg:
          - "========================================"
          - "HOSTNAME     : {{ raw_hostname.stdout | trim }}"
          - "STATUS       : SUCCESS"
          - "LOCAL REPORT : {{ local_report_path }}"
          - "BUCKET       : {{ minio_bucket }}"
          - "MINIO ALIAS  : {{ minio_alias }}"
          - "UPLOAD       : {{ 'SKIPPED (DUPLICATE)' if is_duplicate else 'SUCCESS' }}"
          - "========================================"