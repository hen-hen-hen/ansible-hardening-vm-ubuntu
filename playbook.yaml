---
- name: Linux Hardening Audit RAW Mode - MinIO Upload

  hosts: all

  become: true

  gather_facts: false


  vars:


    #############################################
    # Script Hardening
    #############################################

    script_name: linux_hardening_audit2.sh

    remote_script_dir: /opt/linux_hardening_audit2_temp

    remote_script: "{{ remote_script_dir }}/{{ script_name }}"

    report_name: "hardening-{{ inventory_hostname }}-{{ lookup('pipe', 'date +%F_%H-%M-%S') }}.txt"

    report_path: "{{ remote_script_dir }}/{{ report_name }}"


    #############################################
    # VM Ansible Storage Host
    #############################################

    storage_host: "lst-svr-henry"

    local_report_dir: "/opt/linux_hardening_audit2_temp"

    local_report_path: "{{ local_report_dir }}/{{ report_name }}"


    #############################################
    # MinIO
    #############################################

    minio_bucket: "hardening-linux"

    minio_alias: "minio-server-hardening-linux"

    mc_binary_path: "/usr/local/bin/mc"



  tasks:


    #############################################
    # HOST INFORMATION
    #############################################

    - name: IDENTIFIER - Linux Hardening Audit RAW Mode

      raw: |
        echo "Linux Hardening Audit RAW Mode Started"

      changed_when: false



    - name: Get hostname

      raw: hostname

      register: raw_hostname

      changed_when: false



    - name: Get IP address

      raw: hostname -I | awk '{print $1}'

      register: raw_ip

      changed_when: false



    - name: Get OS info

      raw: |
        cat /etc/os-release |
        grep -E '^(NAME|VERSION)=' |
        tr -d '"'

      register: raw_os

      changed_when: false



    - name: Display target information

      debug:

        msg:

          - "========================================"
          - "Inventory : {{ inventory_hostname }}"
          - "Hostname  : {{ raw_hostname.stdout | trim }}"
          - "IP        : {{ raw_ip.stdout | trim }}"
          - "OS        : {{ raw_os.stdout_lines }}"
          - "========================================"

    #############################################
    # CREATE WORKING DIRECTORY
    #############################################

    - name: Create working directory

      raw: |
        mkdir -p {{ remote_script_dir }}

      changed_when: false



    #############################################
    # CHECK SCRIPT EXIST
    #############################################

    - name: Check hardening script exists

      raw: |
        test -f {{ remote_script }} && echo EXISTS || echo MISSING

      register: script_check

      changed_when: false



    #############################################
    # TRANSFER SCRIPT RAW BASE64
    #############################################

    - name: Transfer hardening script

      raw: >
        echo '{{ lookup("file", "files/" + script_name) | b64encode }}'
        | base64 -d > {{ remote_script }}
        && chmod 0755 {{ remote_script }}

      when:

        - "'MISSING' in script_check.stdout"

      changed_when: true



    #############################################
    # VERIFY SCRIPT
    #############################################

    - name: Verify hardening script

      raw: |
        test -f {{ remote_script }} && echo EXISTS || echo FAILED

      register: script_verify

      changed_when: false



    - name: Stop if script missing

      fail:

        msg: >
          Script hardening tidak ditemukan:
          {{ remote_script }}

      when:

        - "'FAILED' in script_verify.stdout"



    #############################################
    # EXECUTE SCRIPT
    #############################################

    - name: Execute hardening script

      raw: |
        {{ remote_script }} {{ report_path }}

      register: hardening

      changed_when: true



    - name: Show script output

      debug:

        var: hardening.stdout_lines



    - name: Show script error

      debug:

        var: hardening.stderr_lines

      when:

        - hardening.stderr | default('') | length > 0



    #############################################
    # VERIFY REPORT GENERATED
    #############################################

    - name: Verify report exists

      raw: |
        test -f {{ report_path }} && echo EXISTS || echo MISSING

      register: report_check

      changed_when: false



    - name: Stop if report missing

      fail:

        msg: >
          Hardening report tidak dibuat:
          {{ report_path }}

      when:

        - "'MISSING' in report_check.stdout"



    #############################################
    # READ REPORT
    #############################################

    - name: Read report content

      raw: |
        cat {{ report_path }}

      register: report_content

      changed_when: false



    #############################################
    # SHOW REPORT AWX
    #############################################

    - name: Display hardening report

      debug:

        var: report_content.stdout_lines



    #############################################
    # PREPARE STORAGE HOST
    #############################################

    - name: Create storage directory on lst-svr-henry

      delegate_to: "{{ storage_host }}"

      raw: |
        mkdir -p {{ local_report_dir }}

      changed_when: false



    #############################################
    # COPY REPORT TO STORAGE HOST
    #############################################

    - name: Copy report to lst-svr-henry

      raw: |
        scp \
        -o StrictHostKeyChecking=no \
        {{ report_path }} \
        {{ storage_host }}:{{ local_report_path }}

      register: copy_report



    #############################################
    # VERIFY STORAGE REPORT
    #############################################

    - name: Verify report on storage host

      delegate_to: "{{ storage_host }}"

      raw: |
        test -f {{ local_report_path }} && echo EXISTS || echo FAILED

      register: storage_verify

      changed_when: false



    - name: Stop if copy failed

      fail:

        msg: >
          Report gagal dicopy ke:
          {{ storage_host }}

      when:

        - "'FAILED' in storage_verify.stdout"

    #############################################
    # CHECK REPORT CHECKSUM DI STORAGE HOST
    #############################################

    - name: Calculate report checksum on storage host

      delegate_to: "{{ storage_host }}"

      raw: |
        md5sum {{ local_report_path }} | awk '{print $1}'

      register: local_md5

      changed_when: false



    #############################################
    # CHECK OBJECT EXIST DI MINIO
    #############################################

    - name: Check existing object in MinIO

      delegate_to: "{{ storage_host }}"

      raw: |
        {{ mc_binary_path }} stat \
        {{ minio_alias }}/{{ minio_bucket }}/{{ report_name }}

      register: minio_existing

      changed_when: false

      failed_when: false



    #############################################
    # DETERMINE DUPLICATE
    #############################################

    - name: Set duplicate status

      set_fact:

        is_duplicate: "{{ minio_existing.rc == 0 }}"



    - name: Show duplicate status

      debug:

        msg: >
          File {{ report_name }}
          sudah ada di MinIO.
          Upload dilewati.

      when:

        - is_duplicate



    #############################################
    # UPLOAD TO MINIO
    #############################################

    - name: Upload report to MinIO

      delegate_to: "{{ storage_host }}"

      raw: |
        {{ mc_binary_path }} cp \
        {{ local_report_path }} \
        {{ minio_alias }}/{{ minio_bucket }}/{{ report_name }}

      register: minio_upload

      when:

        - not is_duplicate



    #############################################
    # SHOW UPLOAD RESULT
    #############################################

    - name: Display MinIO upload result

      debug:

        var: minio_upload.stdout_lines

      when:

        - not is_duplicate



    #############################################
    # VERIFY MINIO OBJECT
    #############################################

    - name: Verify uploaded object

      delegate_to: "{{ storage_host }}"

      raw: |
        {{ mc_binary_path }} stat \
        {{ minio_alias }}/{{ minio_bucket }}/{{ report_name }}

      register: minio_verify

      changed_when: false

      failed_when: false



    - name: Fail if upload verification failed

      fail:

        msg: >
          File {{ report_name }}
          tidak ditemukan di MinIO bucket {{ minio_bucket }}

      when:

        - minio_verify.rc != 0



    #############################################
    # SUCCESS SUMMARY
    #############################################

    - name: Job Summary

      debug:

        msg:

          - "========================================"
          - "STATUS       : SUCCESS"
          - "HOST         : {{ inventory_hostname }}"
          - "REPORT       : {{ report_name }}"
          - "STORAGE HOST : {{ storage_host }}"
          - "LOCAL FILE   : {{ local_report_path }}"
          - "BUCKET       : {{ minio_bucket }}"
          - "UPLOAD       : {{ 'SKIPPED DUPLICATE' if is_duplicate else 'SUCCESS' }}"
          - "========================================"



  rescue:


    - name: Show Error

      debug:

        msg:

          - "========================================"
          - "STATUS : FAILED"
          - "HOST   : {{ inventory_hostname }}"
          - "TASK   : Linux Hardening Audit"
          - "========================================"



  always:


    #############################################
    # CLEAN TARGET ONLY
    #############################################

    - name: Cleanup script on target

      raw: |
        rm -f {{ remote_script }}

      changed_when: true



    #############################################
    # KEEP REPORT
    #############################################

    - name: Keep audit report

      debug:

        msg:

          - "Report target tidak dihapus"
          - "Report storage tetap tersimpan di:"
          - "{{ local_report_path }}"