---
- name: Linux Hardening Audit RAW Mode - MinIO Upload
  hosts: all
  become: true
  gather_facts: false

  vars:

    #############################################
    # Script Hardening
    #############################################

    script_name: linux_hardening_audit2.sh

    remote_script_dir: /opt/linux_hardening_audit2_temp

    remote_script: "{{ remote_script_dir }}/{{ script_name }}"

    report_name: "hardening-{{ inventory_hostname }}-{{ lookup('pipe', 'date +%F_%H-%M-%S') }}.txt"

    report_path: "{{ remote_script_dir }}/{{ report_name }}"


    #############################################
    # VM Ansible (Storage + mc host)
    #############################################

    storage_host: "lst-svr-henry"

    local_report_dir: "/opt/linux_hardening_audit2_temp"

    local_report_path: "{{ local_report_dir }}/hardening-{{ inventory_hostname }}-report.txt"


    #############################################
    # MinIO Client
    #############################################

    minio_endpoint: "http://10.64.1.2:9000"

    minio_bucket: "hardening-linux"

    minio_alias: "minio-server-hardening-linux"

    mc_binary_path: "/usr/local/bin/mc"

    mc_download_url: "https://dl.min.io/client/mc/release/linux-amd64/mc"


    #############################################
    # Credential AWX
    #############################################

    minio_access_key: "{{ vault_minio_access_key }}"

    minio_secret_key: "{{ vault_minio_secret_key }}"


  pre_tasks:


    #############################################
    # IDENTIFIER
    #############################################

    - name: Identifier
      raw: |
        echo "Linux Hardening Audit RAW Mode Started"

      changed_when: false


    - name: Get hostname
      raw: |
        hostname

      register: raw_hostname

      changed_when: false


    - name: Get IP Address
      raw: |
        hostname -I | awk '{print $1}'

      register: raw_ip

      changed_when: false


    - name: Get OS Information
      raw: |
        cat /etc/os-release |
        grep -E '^(NAME|VERSION)' |
        tr -d '"'

      register: raw_os

      changed_when: false


    - name: Get Timestamp
      raw: |
        date '+%F %T'

      register: raw_timestamp

      changed_when: false


    - name: Display Host Information
      debug:
        msg:
          - "================================"
          - "Inventory : {{ inventory_hostname }}"
          - "Hostname  : {{ raw_hostname.stdout | trim }}"
          - "IP        : {{ raw_ip.stdout | trim }}"
          - "OS        : {{ raw_os.stdout_lines }}"
          - "Time      : {{ raw_timestamp.stdout | trim }}"
          - "================================"


  tasks:

    - name: Linux Hardening Audit Main Block

      block:


        #########################################
        # CREATE WORKING DIRECTORY
        #########################################

        - name: Create working directory
          raw: |
            mkdir -p {{ remote_script_dir }}


        #########################################
        # COPY SCRIPT TO TARGET
        #########################################

        - name: Check script existing
          raw: |
            test -f {{ remote_script }} && echo EXISTS || echo MISSING

          register: script_check

          changed_when: false


        - name: Transfer script to target
          raw: |
            echo '{{ lookup("file", "files/" + script_name) | b64encode }}' | base64 -d > {{ remote_script }}
            chmod 0755 {{ remote_script }}

          when:
            - "'MISSING' in script_check.stdout"


        - name: Verify script
          raw: |
            test -f {{ remote_script }} && echo EXISTS || echo FAILED

          register: script_verify

          changed_when: false


        - name: Stop if script missing
          fail:
            msg: "Script tidak ditemukan: {{ remote_script }}"

          when:
            - "'FAILED' in script_verify.stdout"


        #########################################
        # EXECUTE SCRIPT
        #########################################

        - name: Execute hardening script
          raw: |
            cd {{ remote_script_dir }}
            {{ remote_script }}

          register: hardening_result


        - name: Show execution output
          debug:
            var: hardening_result.stdout_lines

        #########################################
        # DETECT TXT REPORT
        #########################################

        - name: Detect generated TXT report
          raw: |
            find /opt \
            -type f \
            -name "*.txt" \
            -mmin -10 \
            | tail -1

          register: detected_report

          changed_when: false


        - name: Validate TXT report exists
          fail:
            msg: "Report TXT tidak ditemukan setelah script selesai"

          when:
            - detected_report.stdout | trim == ""


        #########################################
        # RENAME REPORT
        #########################################

        - name: Rename report
          raw: |
            mv "{{ detected_report.stdout | trim }}" "{{ report_path }}"


        - name: Verify renamed report
          raw: |
            test -f {{ report_path }} && echo EXISTS || echo FAILED

          register: report_verify

          changed_when: false


        - name: Fail if rename report failed
          fail:
            msg: "Rename report gagal"

          when:
            - "'FAILED' in report_verify.stdout"


        #########################################
        # READ REPORT
        #########################################

        - name: Read report content
          raw: |
            cat {{ report_path }}

          register: report_content

          changed_when: false


        #########################################
        # SHOW REPORT TO AWX
        #########################################

        - name: Display Hardening Report
          debug:
            msg: "{{ report_content.stdout_lines }}"


        #########################################
        # COPY REPORT TO lst-svr-henry
        #########################################

        - name: Copy report to VM Ansible storage
          raw: |
            scp \
            -o StrictHostKeyChecking=no \
            {{ report_path }} \
            {{ storage_host }}:{{ local_report_path }}

          register: copy_result


        - name: Verify report copied to storage
          delegate_to: "{{ storage_host }}"

          raw: |
            test -f {{ local_report_path }} && echo EXISTS || echo FAILED

          register: storage_report_check

          changed_when: false


        - name: Fail copy report
          fail:
            msg: "Copy report ke {{ storage_host }} gagal"

          when:
            - "'FAILED' in storage_report_check.stdout"


        #########################################
        # UPLOAD MINIO USING MC
        #########################################

        - name: Upload report to MinIO
          delegate_to: "{{ storage_host }}"

          raw: |
            {{ mc_binary_path }} cp \
            {{ local_report_path }} \
            {{ minio_alias }}/{{ minio_bucket }}/{{ report_name }}

          register: minio_upload


        - name: Show MinIO upload result
          debug:
            var: minio_upload.stdout_lines


        #########################################
        # VERIFY MINIO OBJECT
        #########################################

        - name: Verify uploaded object
          delegate_to: "{{ storage_host }}"

          raw: |
            {{ mc_binary_path }} stat \
            {{ minio_alias }}/{{ minio_bucket }}/{{ report_name }}

          register: minio_verify

          changed_when: false


        - name: Fail if MinIO verification failed
          fail:
            msg: "File tidak ditemukan di MinIO: {{ report_name }}"

          when:
            - minio_verify.rc != 0


        #########################################
        # SUMMARY
        #########################################

        - name: Job Summary
          debug:
            msg:
              - "================================="
              - "STATUS       : SUCCESS"
              - "HOST         : {{ inventory_hostname }}"
              - "REPORT       : {{ report_name }}"
              - "STORAGE HOST : {{ storage_host }}"
              - "BUCKET       : {{ minio_bucket }}"
              - "UPLOAD       : SUCCESS"
              - "================================="


      #########################################
      # RESCUE
      #########################################

      rescue:

        - name: Show Error
          debug:
            msg:
              - "================================="
              - "STATUS : FAILED"
              - "HOST   : {{ inventory_hostname }}"
              - "TASK   : Linux Hardening Audit"
              - "================================="


      #########################################
      # ALWAYS CLEANUP
      #########################################

      always:


        #######################################
        # CLEAN TARGET VM
        #######################################

        - name: Cleanup target working directory
          raw: |
            rm -rf {{ remote_script_dir }}

          changed_when: true


        #######################################
        # CLEAN STORAGE TEMP REPORT
        #######################################

        - name: Cleanup storage temporary report
          delegate_to: "{{ storage_host }}"

          raw: |
            rm -f {{ local_report_path }}

          changed_when: false            