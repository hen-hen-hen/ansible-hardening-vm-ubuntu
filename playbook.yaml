---
- name: Linux Hardening Audit
  hosts: all
  become: true
  gather_facts: true

  vars:

    #############################################
    # Script Hardening
    # NOTE: jika script sudah ada di host target,
    # copy akan di-skip otomatis (idempoten)
    #############################################

    script_name: linux_hardening_audit2.sh
    remote_script: /opt/linux_hardening_audit2.sh

    report_name: "hardening-{{ ansible_hostname }}.txt"
    report_path: "/opt/{{ report_name }}"

    #############################################
    # Penyimpanan Lokal di VM Ansible
    #############################################

    local_report_dir: "/opt/linux_hardening_audit2_temp"
    local_report_path: "{{ local_report_dir }}/{{ report_name }}"

    #############################################
    # MinIO Client (mc)
    # NOTE: mc sudah diinstall & alias sudah dikonfigurasi
    # manual di VM Ansible ini, contoh:
    #   mc alias set minio-server-hardening-linux \
    #     http://10.64.1.2:9000 <access_key> <secret_key>
    #############################################

    minio_bucket: "hardening-linux"
    minio_alias: "minio-server-hardening-linux"

    mc_binary_path: "/usr/local/bin/mc"

  tasks:

#########################################################################
# HOST INFORMATION
#########################################################################

    - name: Display target information
      debug:
        msg:
          - "========================================"
          - "Inventory : {{ inventory_hostname }}"
          - "Hostname  : {{ ansible_hostname }}"
          - "IP        : {{ ansible_default_ipv4.address }}"
          - "OS        : {{ ansible_distribution }} {{ ansible_distribution_version }}"
          - "========================================"

#########################################################################
# ENSURE SCRIPT EXISTS ON TARGET (COPY HANYA JIKA BELUM ADA)
#########################################################################

    # Jika script sudah ada di host target (mis. sudah pernah di-deploy
    # manual seperti di lst-svr-henry), copy DI-SKIP.
    # Jika belum ada, script akan di-copy dari AWX Project files/.

    - name: Check if hardening script already exists on target host
      stat:
        path: "{{ remote_script }}"
      register: script_check_before

    - name: Copy hardening script from AWX Project (jika belum ada di host)
      copy:
        src: "files/{{ script_name }}"
        dest: "{{ remote_script }}"
        owner: root
        group: root
        mode: "0755"
      when: not script_check_before.stat.exists

    - name: Verify hardening script exists on target host
      stat:
        path: "{{ remote_script }}"
      register: script_check_after

    - name: Stop if hardening script still not found
      fail:
        msg: >
          Script hardening tidak ditemukan di {{ remote_script }} pada host
          {{ ansible_hostname }}, dan gagal di-copy dari AWX Project.
          Pastikan file {{ script_name }} ada di folder files/ pada repo,
          atau taruh manual di path tersebut pada host target.
      when: not script_check_after.stat.exists

    - name: Ensure script is executable
      file:
        path: "{{ remote_script }}"
        owner: root
        group: root
        mode: "0755"

#########################################################################
# EXECUTE SCRIPT
#########################################################################

    - name: Execute hardening script
      shell: "{{ remote_script }} {{ report_path }}"
      args:
        executable: /bin/bash
      register: hardening
      changed_when: true

#########################################################################
# SHOW OUTPUT
#########################################################################

    - name: Show script output
      debug:
        var: hardening.stdout_lines

    - name: Show script error
      debug:
        var: hardening.stderr_lines
      when: hardening.stderr != ""

#########################################################################
# VERIFY REPORT (REMOTE)
#########################################################################

    - name: Verify report exists
      stat:
        path: "{{ report_path }}"
      register: report

    - name: Stop if report missing
      fail:
        msg: "Hardening report was not generated."
      when: not report.stat.exists

#########################################################################
# SHOW REPORT
#########################################################################

    - name: Display report
      shell: cat "{{ report_path }}"
      register: report_content
      changed_when: false

    - debug:
        var: report_content.stdout_lines

#########################################################################
# PREPARE LOCAL STORAGE (ANSIBLE VM)
#########################################################################

    - name: Ensure local temp directory exists on Ansible VM
      delegate_to: localhost
      run_once: false
      file:
        path: "{{ local_report_dir }}"
        state: directory
        mode: "0755"

#########################################################################
# FETCH REPORT TO ANSIBLE LOCAL VM
#########################################################################

    - name: Fetch report to local Ansible VM
      fetch:
        src: "{{ report_path }}"
        dest: "{{ local_report_path }}"
        flat: yes

#########################################################################
# VALIDATE DUPLICATE BEFORE UPLOAD
#########################################################################

    # Catatan: perbandingan checksum ini akurat untuk file yang diupload
    # sebagai single-part (mc cp untuk file kecil seperti .txt selalu
    # single-part), karena ETag = MD5 pada kondisi tersebut.

    - name: Compute local report checksum (md5)
      delegate_to: localhost
      stat:
        path: "{{ local_report_path }}"
        checksum_algorithm: md5
      register: local_report_stat

    - name: Check if report already exists in MinIO bucket
      delegate_to: localhost
      command: "{{ mc_binary_path }} stat {{ minio_alias }}/{{ minio_bucket }}/{{ report_name }}"
      register: mc_remote_stat
      changed_when: false
      failed_when: false

    - name: Extract remote ETag (jika object sudah ada)
      delegate_to: localhost
      set_fact:
        remote_etag: "{{ (mc_remote_stat.stdout | regex_search('ETag\\s*:\\s*([a-f0-9]+)', '\\1') | first) | default('') }}"
      when: mc_remote_stat.rc == 0

    - name: Determine duplicate status
      delegate_to: localhost
      set_fact:
        is_duplicate: "{{ (mc_remote_stat.rc == 0) and (remote_etag | default('') == local_report_stat.stat.checksum) }}"

    - name: Show duplicate skip message
      debug:
        msg: "File {{ report_name }} sudah ada di bucket dengan checksum identik, upload dilewati (SKIP)."
      when: is_duplicate

#########################################################################
# UPLOAD REPORT TO MINIO USING MC
#########################################################################

    - name: Upload report to MinIO using mc
      delegate_to: localhost
      command: >
        {{ mc_binary_path }} cp {{ local_report_path }}
        {{ minio_alias }}/{{ minio_bucket }}/{{ report_name }}
      register: upload_result
      changed_when: true
      when: not is_duplicate

    - name: Show upload result
      debug:
        var: upload_result.stdout_lines
      when: not is_duplicate

#########################################################################
# VERIFY UPLOAD (MC)
#########################################################################

    - name: Verify object exists in MinIO bucket
      delegate_to: localhost
      command: "{{ mc_binary_path }} stat {{ minio_alias }}/{{ minio_bucket }}/{{ report_name }}"
      register: mc_stat_result
      changed_when: false
      failed_when: mc_stat_result.rc != 0

    - name: Upload validation
      fail:
        msg: "Upload report ke MinIO gagal untuk {{ report_name }}."
      when: mc_stat_result.rc != 0

#########################################################################
# CLEANUP REMOTE
#########################################################################

    - name: Remove report (remote host)
      file:
        path: "{{ report_path }}"
        state: absent

    - name: Remove script (remote host)
      file:
        path: "{{ remote_script }}"
        state: absent

#########################################################################
# NOTE: LOCAL REPORT FILE
#########################################################################

    # File laporan lokal sengaja TIDAK dihapus, karena sesuai permintaan
    # laporan harus tetap tersimpan di {{ local_report_dir }} pada VM Ansible.
    # Jika ke depannya ingin dihapus otomatis setelah upload sukses,
    # tinggal tambahkan task "file: state: absent" delegate_to localhost.

#########################################################################
# SUCCESS
#########################################################################

    - name: Job Summary
      debug:
        msg:
          - "========================================"
          - "HOSTNAME     : {{ ansible_hostname }}"
          - "STATUS       : SUCCESS"
          - "LOCAL REPORT : {{ local_report_path }}"
          - "BUCKET       : {{ minio_bucket }}"
          - "MINIO ALIAS  : {{ minio_alias }}"
          - "UPLOAD       : {{ 'SKIPPED (DUPLICATE)' if is_duplicate else 'SUCCESS' }}"
          - "========================================"