---
- name: Linux Hardening Audit RAW Mode - MinIO Upload

  hosts: all

  become: true

  gather_facts: false


  vars:

    #############################################
    # Script Hardening
    #############################################

    script_name: linux_hardening_audit2.sh

    remote_script_dir: /opt/linux_hardening_audit2_temp

    remote_script: "{{ remote_script_dir }}/{{ script_name }}"

    report_name: "hardening-{{ inventory_hostname }}-{{ lookup('pipe', 'date +%F_%H-%M-%S') }}.txt"

    report_path: "{{ remote_script_dir }}/{{ report_name }}"


    #############################################
    # Storage VM Ansible
    #############################################

    storage_host: "lst-svr-henry"

    local_report_dir: "/opt/linux_hardening_audit2_temp"

    local_report_path: "{{ local_report_dir }}/{{ report_name }}"


    #############################################
    # MinIO
    #############################################

    minio_bucket: "hardening-linux"

    minio_alias: "minio-server-hardening-linux"

    mc_binary_path: "/usr/local/bin/mc"



  tasks:


    #############################################
    # SKIP STORAGE HOST
    #############################################

    - name: Skip storage server

      meta: end_host

      when:
        - inventory_hostname == storage_host



    #############################################
    # HOST INFORMATION
    #############################################

    - name: Identifier

      raw: |
        echo "Linux Hardening Audit RAW Mode Started"

      changed_when: false


    - name: Get hostname

      raw: hostname

      register: raw_hostname

      changed_when: false


    - name: Get IP Address

      raw: "hostname -I | awk '{print $1}'"

      register: raw_ip

      changed_when: false


    - name: Get OS Information

      raw: |
        cat /etc/os-release |
        grep -E '^(NAME|VERSION)=' |
        tr -d '"'

      register: raw_os

      changed_when: false


    - name: Get Timestamp

      raw: date '+%F %T'

      register: raw_timestamp

      changed_when: false


    - name: Display host information

      debug:

        msg:

          - "================================="
          - "Inventory : {{ inventory_hostname }}"
          - "Hostname  : {{ raw_hostname.stdout | trim }}"
          - "IP        : {{ raw_ip.stdout | trim }}"
          - "OS        : {{ raw_os.stdout_lines }}"
          - "Time      : {{ raw_timestamp.stdout | trim }}"
          - "================================="



    #############################################
    # MAIN BLOCK
    #############################################

    - name: Linux Hardening Audit Process

      block:


        #########################################
        # CREATE DIRECTORY
        #########################################

        - name: Create working directory

          raw: |
            mkdir -p {{ remote_script_dir }}

          changed_when: false



        #########################################
        # COPY SCRIPT
        #########################################

        - name: Check script existing

          raw: |
            test -f {{ remote_script }} && echo EXISTS || echo MISSING

          register: script_check

          changed_when: false



        - name: Transfer hardening script

          raw: >
            echo '{{ lookup("file", "files/" + script_name) | b64encode }}'
            | base64 -d > {{ remote_script }}
            && chmod 0755 {{ remote_script }}

          when:
            - "'MISSING' in script_check.stdout"

          changed_when: true



        - name: Verify script

          raw: |
            test -f {{ remote_script }} && echo EXISTS || echo FAILED

          register: script_verify

          changed_when: false



        - name: Fail if script missing

          fail:

            msg: "Script tidak ditemukan {{ remote_script }}"

          when:
            - "'FAILED' in script_verify.stdout"



        #########################################
        # EXECUTE SCRIPT
        #########################################

        - name: Execute hardening script

          raw: |
            {{ remote_script }} {{ report_path }}

          register: hardening_result

          changed_when: true



        - name: Show script output

          debug:

            var: hardening_result.stdout_lines



        #########################################
        # VERIFY REPORT
        #########################################

        - name: Verify report

          raw: |
            test -f {{ report_path }} && echo EXISTS || echo FAILED

          register: report_check

          changed_when: false



        - name: Fail report missing

          fail:

            msg: "Report tidak ditemukan"

          when:
            - "'FAILED' in report_check.stdout"



        #########################################
        # COPY REPORT TO STORAGE
        #########################################

        - name: Create storage directory

          delegate_to: "{{ storage_host }}"

          raw: |
            mkdir -p {{ local_report_dir }}

          changed_when: false



        - name: Copy report to storage host

          raw: |
            scp \
            -o StrictHostKeyChecking=no \
            {{ report_path }} \
            {{ storage_host }}:{{ local_report_path }}

          register: copy_report



        - name: Verify storage report

          delegate_to: "{{ storage_host }}"

          raw: |
            test -f {{ local_report_path }} && echo EXISTS || echo FAILED

          register: storage_check

          changed_when: false



        - name: Fail copy report

          fail:

            msg: "Report gagal dicopy ke storage"

          when:
            - "'FAILED' in storage_check.stdout"



        #########################################
        # MINIO UPLOAD
        #########################################

        - name: Upload report MinIO

          delegate_to: "{{ storage_host }}"

          raw: |
            {{ mc_binary_path }} cp \
            {{ local_report_path }} \
            {{ minio_alias }}/{{ minio_bucket }}/{{ report_name }}

          register: upload_result



        - name: Show upload result

          debug:

            var: upload_result.stdout_lines



        #########################################
        # VERIFY MINIO
        #########################################

        - name: Verify MinIO object

          delegate_to: "{{ storage_host }}"

          raw: |
            {{ mc_binary_path }} stat \
            {{ minio_alias }}/{{ minio_bucket }}/{{ report_name }}

          register: minio_verify

          changed_when: false

          failed_when: false



        - name: Fail MinIO verify

          fail:

            msg: "Upload MinIO gagal"

          when:
            - minio_verify.rc != 0



        #########################################
        # SUMMARY
        #########################################

        - name: Summary

          debug:

            msg:

              - "================================="
              - "STATUS       : SUCCESS"
              - "HOST         : {{ inventory_hostname }}"
              - "REPORT       : {{ report_name }}"
              - "STORAGE HOST : {{ storage_host }}"
              - "MINIO BUCKET : {{ minio_bucket }}"
              - "================================="



      rescue:


        - name: Show Error

          debug:

            msg:

              - "================================="
              - "STATUS : FAILED"
              - "HOST   : {{ inventory_hostname }}"
              - "================================="



      always:


        #########################################
        # CLEAN SCRIPT ONLY
        #########################################

        - name: Cleanup script

          raw: |
            rm -f {{ remote_script }}

          changed_when: true



        - name: Keep report

          debug:

            msg:

              - "Report tidak dihapus"
              - "Lokasi storage:"
              - "{{ local_report_path }}"