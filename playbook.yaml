---

- name: Linux Hardening Audit RAW Mode - MinIO Upload
  hosts: all
  become: true
  gather_facts: false


  vars:

    #############################################
    # SCRIPT
    #############################################

    script_name: linux_hardening_audit2.sh

    remote_script_dir: /opt/linux_hardening_audit2_temp

    remote_script: "{{ remote_script_dir }}/{{ script_name }}"


    #############################################
    # STORAGE HOST (VM ANSIBLE)
    #############################################

    storage_host: "lst-svr-henry"

    local_report_dir: "/opt/linux_hardening_audit2_temp"


    #############################################
    # MINIO
    #############################################

    minio_bucket: "hardening-linux"

    minio_alias: "minio-server-hardening-linux"

    mc_binary_path: "/usr/local/bin/mc"



  tasks:


    #############################################
    # INFORMATION
    #############################################

    - name: Identifier
      raw: |
        echo "Linux Hardening Audit RAW Mode Started"
      changed_when: false


    - name: Get hostname
      raw: hostname
      register: raw_hostname
      changed_when: false


    - name: Get IP
      raw: |
        hostname -I | awk '{print $1}'
      register: raw_ip
      changed_when: false


    - name: Show information
      debug:
        msg:
          - "================================="
          - "Inventory : {{ inventory_hostname }}"
          - "Hostname  : {{ raw_hostname.stdout | trim }}"
          - "IP        : {{ raw_ip.stdout | trim }}"
          - "================================="



    #############################################
    # CREATE DIRECTORY
    #############################################

    - name: Create working directory
      raw: |
        mkdir -p {{ remote_script_dir }}
      changed_when: false



    #############################################
    # COPY SCRIPT
    #############################################

    - name: Check script
      raw: |
        test -f {{ remote_script }} && echo EXISTS || echo MISSING

      register: script_check

      changed_when: false



    - name: Transfer script
      raw: |
        echo '{{ lookup("file","files/" + script_name) | b64encode }}' \
        | base64 -d > {{ remote_script }}

        chmod 0755 {{ remote_script }}

      when:
        - "'MISSING' in script_check.stdout"



    - name: Verify script
      raw: |
        test -f {{ remote_script }} && echo EXISTS || echo FAILED

      register: script_verify

      changed_when: false



    - name: Fail script missing
      fail:
        msg: "Script tidak ditemukan"
      when:
        - "'FAILED' in script_verify.stdout"



    #############################################
    # EXECUTE SCRIPT
    # TANPA PARAMETER
    #############################################

    - name: Execute hardening script
      raw: |
        cd {{ remote_script_dir }}

        {{ remote_script }}

      register: script_result



    - name: Show script result
      debug:
        var: script_result.stdout_lines



    #############################################
    # FIND REPORT
    #############################################

    - name: Find generated report
      raw: |
        find {{ remote_script_dir }} \
        -maxdepth 1 \
        -type f \
        -name "*.txt" \
        -printf "%T@ %p\n" |
        sort -nr |
        head -1 |
        cut -d' ' -f2

      register: detected_report

      changed_when: false



    - name: Validate report
      fail:
        msg: |
          Report tidak ditemukan

          Directory:
          {{ remote_script_dir }}

      when:
        - detected_report.stdout | trim == ""



    - name: Set report variable
      set_fact:

        report_path: "{{ detected_report.stdout | trim }}"

        report_name: "{{ detected_report.stdout | trim | basename }}"



    - name: Display report path
      debug:
        msg:
          - "Report:"
          - "{{ report_path }}"



    #############################################
    # COPY REPORT KE STORAGE HOST
    #############################################

    - name: Create storage directory
      delegate_to: "{{ storage_host }}"
      raw: |
        mkdir -p {{ local_report_dir }}

      changed_when: false



    - name: Copy report to storage host
      raw: |
        scp \
        -o StrictHostKeyChecking=no \
        {{ report_path }} \
        {{ storage_host }}:{{ local_report_dir }}/{{ report_name }}



    - name: Verify report on storage host
      delegate_to: "{{ storage_host }}"

      raw: |
        test -f {{ local_report_dir }}/{{ report_name }} \
        && echo EXISTS \
        || echo FAILED

      register: storage_check

      changed_when: false



    - name: Fail storage copy
      fail:
        msg: "Report gagal dicopy ke {{ storage_host }}"

      when:
        - "'FAILED' in storage_check.stdout"



    #############################################
    # UPLOAD MINIO
    # JALAN DI lst-svr-henry
    #############################################

    - name: Upload report MinIO
      delegate_to: "{{ storage_host }}"

      command: >
        {{ mc_binary_path }}
        cp
        {{ local_report_dir }}/{{ report_name }}
        {{ minio_alias }}/{{ minio_bucket }}/{{ report_name }}


      register: minio_upload



    - name: Show upload result
      debug:
        var: minio_upload.stdout_lines



    #############################################
    # VERIFY MINIO
    #############################################

    - name: Verify MinIO object
      delegate_to: "{{ storage_host }}"

      command: >
        {{ mc_binary_path }}
        stat
        {{ minio_alias }}/{{ minio_bucket }}/{{ report_name }}


      register: minio_verify


      changed_when: false



    - name: Fail MinIO verify
      fail:
        msg: "Upload MinIO gagal"

      when:
        - minio_verify.rc != 0



    #############################################
    # SUMMARY
    #############################################

    - name: Summary
      debug:
        msg:

          - "================================="
          - "STATUS : SUCCESS"
          - "HOST   : {{ inventory_hostname }}"
          - "REPORT : {{ report_name }}"
          - "MINIO  : SUCCESS"
          - "================================="