---

- name: Linux Hardening Audit RAW Mode - MinIO Upload
  hosts: all
  become: true
  gather_facts: false


  vars:

    #############################################
    # SCRIPT HARDENING
    #############################################

    script_name: linux_hardening_audit2.sh

    remote_script_dir: /opt/linux_hardening_audit2_temp

    remote_script: "{{ remote_script_dir }}/{{ script_name }}"


    #############################################
    # STORAGE HOST (VM ANSIBLE + MC)
    #############################################

    storage_host: "lst-svr-henry"

    local_report_dir: "/opt/linux_hardening_audit2_temp"

    local_report_path:
      "{{ local_report_dir }}/{{ inventory_hostname }}-hardening-report.txt"


    #############################################
    # MINIO
    #############################################

    mc_binary_path: "/usr/local/bin/mc"

    minio_alias: "minio-server-hardening-linux"

    minio_bucket: "hardening-linux"



  tasks:


    #############################################
    # IDENTIFIER
    #############################################

    - name: Identifier
      raw: |
        echo "Linux Hardening Audit RAW Mode Started"
      changed_when: false



    #############################################
    # HOST INFORMATION
    #############################################

    - name: Get hostname
      raw: hostname
      register: raw_hostname
      changed_when: false


    - name: Get IP
      raw: "hostname -I | awk '{print $1}'"
      register: raw_ip
      changed_when: false


    - name: Get OS
      raw: |
        cat /etc/os-release | grep -E '^(NAME|VERSION)=' | tr -d '"'
      register: raw_os
      changed_when: false


    - name: Display information
      debug:
        msg:
          - "=============================="
          - "Inventory : {{ inventory_hostname }}"
          - "Hostname  : {{ raw_hostname.stdout | trim }}"
          - "IP        : {{ raw_ip.stdout | trim }}"
          - "OS        : {{ raw_os.stdout_lines }}"
          - "=============================="



    #############################################
    # CREATE DIRECTORY
    #############################################

    - name: Create working directory
      raw: |
        mkdir -p {{ remote_script_dir }}
      changed_when: false



    #############################################
    # COPY SCRIPT
    #############################################

    - name: Check script
      raw: |
        test -f {{ remote_script }} && echo EXISTS || echo MISSING
      register: script_check
      changed_when: false



    - name: Transfer script
      raw: |
        echo '{{ lookup("file","files/" + script_name) | b64encode }}' \
        | base64 -d > {{ remote_script }}

        chmod 0755 {{ remote_script }}

      when:
        - "'MISSING' in script_check.stdout"



    - name: Verify script
      raw: |
        test -f {{ remote_script }} && echo EXISTS || echo FAILED
      register: script_verify
      changed_when: false



    - name: Stop if script missing
      fail:
        msg: "Script tidak ditemukan"
      when:
        - "'FAILED' in script_verify.stdout"



    #############################################
    # EXECUTE SCRIPT
    #############################################

    - name: Execute hardening script
      raw: |
        cd {{ remote_script_dir }}

        {{ remote_script }}

      register: hardening_result
      changed_when: true



    - name: Show script result
      debug:
        var: hardening_result.stdout_lines



    #############################################
    # FIND GENERATED REPORT
    #############################################

    - name: Detect generated report
      raw: |
        find {{ remote_script_dir }} \
        -maxdepth 1 \
        -type f \
        -name "*.txt" \
        -printf "%T@ %p\n" |
        sort -nr |
        head -1 |
        cut -d' ' -f2-

      register: detected_report

      changed_when: false



    - name: Validate report
      fail:
        msg: "Report tidak ditemukan"
      when:
        - detected_report.stdout | trim == ""



    - name: Set report variable
      set_fact:

        real_report_path:
          "{{ detected_report.stdout | trim }}"

        real_report_name:
          "{{ detected_report.stdout | trim | basename }}"



    #############################################
    # COPY REPORT TO STORAGE HOST
    #############################################

    - name: Create storage directory
      delegate_to: "{{ storage_host }}"
      raw: |
        mkdir -p {{ local_report_dir }}


    - name: Read report
      raw: |
        cat {{ real_report_path }}

      register: report_content

      changed_when: false



    - name: Save report on storage host
      delegate_to: "{{ storage_host }}"
      copy:

        content:
          "{{ report_content.stdout }}"

        dest:
          "{{ local_report_path }}"

        mode: "0644"



    #############################################
    # UPLOAD MINIO FROM STORAGE HOST
    #############################################

    - name: Upload report to MinIO
      delegate_to: "{{ storage_host }}"

      command: >

        {{ mc_binary_path }} cp

        {{ local_report_path }}

        {{ minio_alias }}/{{ minio_bucket }}/{{ real_report_name }}

      register: minio_upload



    - name: Show MinIO result
      debug:
        var: minio_upload.stdout_lines



    #############################################
    # VERIFY MINIO
    #############################################

    - name: Verify MinIO object
      delegate_to: "{{ storage_host }}"

      command: >

        {{ mc_binary_path }} stat

        {{ minio_alias }}/{{ minio_bucket }}/{{ real_report_name }}

      register: minio_verify

      changed_when: false



    - name: Fail MinIO
      fail:
        msg:
          - "Upload MinIO gagal"
          - "{{ real_report_name }}"

      when:
        - minio_verify.rc != 0



    #############################################
    # CLEAN SCRIPT ONLY
    #############################################

    - name: Remove script temporary
      raw: |
        rm -f {{ remote_script }}



    #############################################
    # SUMMARY
    #############################################

    - name: Summary
      debug:

        msg:

          - "=============================="
          - "STATUS       : SUCCESS"
          - "HOST         : {{ inventory_hostname }}"
          - "REPORT       : {{ real_report_name }}"
          - "STORAGE HOST : {{ storage_host }}"
          - "MINIO        : SUCCESS"
          - "=============================="